<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__PAGE_TITLE__</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b11;
            --panel: rgba(255, 255, 255, 0.08);
            --text: #f7f9fd;
            --muted: rgba(247, 249, 253, 0.65);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            font-family: "SF Pro Display", "Helvetica Neue", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(143, 211, 255, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(51, 101, 196, 0.18), transparent 38%),
                linear-gradient(160deg, #080b11, #0d1728 55%, #060910);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 12px;
            overflow: hidden;
        }
        .shell {
            width: 98vw;
            height: calc(100vh - 24px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 12px;
        }
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: var(--panel);
            backdrop-filter: blur(18px);
        }
        .hero-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .eyebrow {
            margin: 0 0 6px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }
        h1 {
            margin: 0;
            font-size: clamp(22px, 2.4vw, 34px);
            line-height: 1.05;
        }
        .status {
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--muted);
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        .control-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 8px 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .stage {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #000;
            min-height: 0;
            box-shadow: 0 36px 90px rgba(0, 0, 0, 0.45);
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(180deg, rgba(6, 9, 16, 0.22), rgba(6, 9, 16, 0.72));
            text-align: center;
        }
        .overlay[hidden] { display: none; }
        .card {
            max-width: 520px;
            padding: 24px;
            border-radius: 22px;
            background: rgba(8, 11, 17, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card h2 { margin: 0 0 10px; }
        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }
        .footnote {
            font-size: 13px;
            color: var(--muted);
            padding: 0 8px;
        }
        body.mode-native {
            height: auto;
            min-height: 100vh;
            overflow: auto;
        }
        body.mode-native .shell {
            height: auto;
            min-height: calc(100vh - 24px);
        }
        body.mode-native .stage {
            overflow: auto;
            display: block;
        }
        body.mode-native video {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            margin: 0 auto;
        }
        @media (max-height: 860px) {
            .hero {
                padding: 12px 16px;
            }
            h1 {
                font-size: clamp(18px, 2vw, 28px);
            }
            .footnote {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div>
                <p class="eyebrow">VoidDisplay Live</p>
                <h1>__PAGE_TITLE__</h1>
            </div>
            <div class="hero-actions">
                <div class="status" id="status">Connecting…</div>
                <div class="controls">
                    <button class="control-btn" id="scale-mode-btn" type="button">1:1</button>
                    <button class="control-btn" id="fullscreen-btn" type="button">Fullscreen</button>
                </div>
            </div>
        </section>

        <section class="stage">
            <video id="player" autoplay playsinline muted></video>
            <div class="overlay" id="overlay">
                <div class="card">
                    <h2 id="message-title">Connecting…</h2>
                    <p id="message-body">Preparing the WebRTC stream.</p>
                </div>
            </div>
        </section>

        <p class="footnote">Use `1:1` for original size and `Fullscreen` for immersive view.</p>
    </div>

    <script id="voiddisplay-bootstrap" type="application/json">__BOOTSTRAP_JSON__</script>
    <script>
        const signalPath = "__SIGNAL_PATH__";
        const bootstrapEl = document.getElementById("voiddisplay-bootstrap");
        const statusEl = document.getElementById("status");
        const overlayEl = document.getElementById("overlay");
        const messageTitleEl = document.getElementById("message-title");
        const messageBodyEl = document.getElementById("message-body");
        const player = document.getElementById("player");
        const stage = document.querySelector(".stage");
        const scaleModeBtn = document.getElementById("scale-mode-btn");
        const fullscreenBtn = document.getElementById("fullscreen-btn");

        let socket = null;
        let peer = null;
        let reconnectIndex = 0;
        let reconnectTimer = null;
        var terminalStop = false;
        let state = "idle";
        let originalScaleEnabled = false;
        const reconnectDelays = [250, 500, 1000, 2000, 4000];
        const bootstrap = (() => {
            if (!bootstrapEl?.textContent) {
                return { iceServers: [] };
            }
            try {
                const parsed = JSON.parse(bootstrapEl.textContent);
                const iceServers = Array.isArray(parsed?.iceServers) ? parsed.iceServers : [];
                return { iceServers };
            } catch {
                return { iceServers: [] };
            }
        })();

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function transition(nextState) {
            state = nextState;
        }

        function setOverlay(title, body, visible = true) {
            messageTitleEl.textContent = title;
            messageBodyEl.textContent = body;
            overlayEl.hidden = !visible;
        }

        function applyScaleMode() {
            document.body.classList.toggle("mode-native", originalScaleEnabled);
            if (scaleModeBtn) {
                scaleModeBtn.textContent = originalScaleEnabled ? "Fit" : "1:1";
            }
        }

        function syncFullscreenButtonLabel() {
            if (!fullscreenBtn) return;
            fullscreenBtn.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
        }

        async function toggleFullscreen() {
            if (!document.fullscreenEnabled || !stage) return;
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else {
                    await stage.requestFullscreen();
                }
            } catch {
                // no-op: button state will remain unchanged
            }
        }

        scaleModeBtn?.addEventListener("click", () => {
            originalScaleEnabled = !originalScaleEnabled;
            applyScaleMode();
        });

        fullscreenBtn?.addEventListener("click", () => {
            toggleFullscreen();
        });

        document.addEventListener("fullscreenchange", syncFullscreenButtonLabel);
        applyScaleMode();
        syncFullscreenButtonLabel();

        function closePeer() {
            if (peer) {
                peer.ontrack = null;
                peer.onicecandidate = null;
                peer.onconnectionstatechange = null;
                peer.close();
                peer = null;
            }
            player.srcObject = null;
        }

        function isSocketConnectingOrOpen(ws) {
            if (!ws) return false;
            return ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN;
        }

        function closeSocketAndClearReference() {
            const ws = socket;
            if (!ws) return;
            socket = null;
            try {
                ws.close();
            } catch {
                // no-op
            }
        }

        function clearReconnectTimer() {
            if (reconnectTimer) {
                window.clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
        }

        function scheduleReconnect() {
            if (terminalStop || state === "stopping" || state === "closed") {
                return;
            }
            if (reconnectTimer) {
                return;
            }
            const delay = reconnectDelays[Math.min(reconnectIndex, reconnectDelays.length - 1)];
            reconnectIndex += 1;
            setStatus(`Reconnecting in ${delay}ms`);
            setOverlay("Reconnecting…", "The signaling channel dropped. Retrying automatically.", true);
            transition("handshaking");
            reconnectTimer = window.setTimeout(() => {
                reconnectTimer = null;
                connect();
            }, delay);
        }

        async function sendSignal(payload) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify(payload));
        }

        async function startPeerConnection() {
            closePeer();
            peer = new RTCPeerConnection({ iceServers: bootstrap.iceServers ?? [] });

            peer.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    player.srcObject = event.streams[0];
                    setStatus("Live");
                    setOverlay("Live stream", "Connected and receiving frames.", false);
                    transition("streaming");
                }
            };

            peer.onicecandidate = (event) => {
                if (!event.candidate) {
                    sendSignal({ type: "ice_complete" });
                    return;
                }
                sendSignal({
                    type: "ice_candidate",
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex
                });
            };

            peer.onconnectionstatechange = () => {
                if (peer.connectionState === "failed" || peer.connectionState === "disconnected") {
                    setStatus("Connection lost");
                    setOverlay("Connection lost", "Trying to reconnect to the stream.", true);
                    if (!terminalStop) {
                        closeSocketAndClearReference();
                        scheduleReconnect();
                    }
                }
            };

            const offer = await peer.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: true
            });
            await peer.setLocalDescription(offer);
            await sendSignal({ type: "offer", sdp: offer.sdp });
            transition("negotiating");
        }

        function connect() {
            if (terminalStop || state === "closed") {
                return;
            }
            if (isSocketConnectingOrOpen(socket)) {
                return;
            }
            if (!window.WebSocket) {
                setStatus("Unsupported browser");
                setOverlay("WebSocket required", "This browser cannot open signaling transport.", true);
                transition("closed");
                return;
            }
            if (!window.RTCPeerConnection) {
                setStatus("Unsupported browser");
                setOverlay("WebRTC required", "This browser does not support RTCPeerConnection.", true);
                transition("closed");
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const wsUrl = `${protocol}://${window.location.host}${signalPath}`;
            const ws = new WebSocket(wsUrl);
            socket = ws;
            transition("handshaking");
            setStatus("Connecting…");
            setOverlay("Connecting…", "Preparing the WebRTC signaling channel.", true);

            ws.addEventListener("open", async () => {
                if (socket !== ws) return;
                reconnectIndex = 0;
                clearReconnectTimer();
                transition("signalingReady");
                setStatus("Signaling connected");
                await sendSignal({ type: "viewer_ready" });
                try {
                    await startPeerConnection();
                    setOverlay("Negotiating…", "Exchanging offer/answer and ICE candidates.", true);
                } catch (error) {
                    setStatus("Negotiation failed");
                    setOverlay("Negotiation failed", error?.message || "Failed to create WebRTC offer.", true);
                    closeSocketAndClearReference();
                    scheduleReconnect();
                }
            });

            ws.addEventListener("message", async (event) => {
                if (socket !== ws) return;
                if (typeof event.data !== "string") {
                    return;
                }

                let payload;
                try {
                    payload = JSON.parse(event.data);
                } catch {
                    return;
                }

                if (!payload || typeof payload.type !== "string") {
                    return;
                }

                switch (payload.type) {
                    case "answer":
                        if (!peer || typeof payload.sdp !== "string") return;
                        await peer.setRemoteDescription({
                            type: "answer",
                            sdp: payload.sdp
                        });
                        setStatus("Connected");
                        break;
                    case "ice_candidate":
                        if (!peer || typeof payload.candidate !== "string") return;
                        await peer.addIceCandidate({
                            candidate: payload.candidate,
                            sdpMid: payload.sdpMid || null,
                            sdpMLineIndex: Number.isInteger(payload.sdpMLineIndex) ? payload.sdpMLineIndex : 0
                        });
                        break;
                    case "stopped":
                        terminalStop = true;
                        transition("stopping");
                        setStatus("Stopped");
                        setOverlay("Sharing stopped", "The source stream is no longer available.", true);
                        closePeer();
                        clearReconnectTimer();
                        closeSocketAndClearReference();
                        transition("closed");
                        break;
                    case "error":
                        terminalStop = true;
                        setStatus("Error");
                        setOverlay("Stream error", payload.reason || "Unknown signaling error.", true);
                        clearReconnectTimer();
                        closePeer();
                        closeSocketAndClearReference();
                        transition("closed");
                        break;
                    default:
                        break;
                }
            });

            ws.addEventListener("close", () => {
                if (socket !== ws) return;
                socket = null;
                closePeer();
                if (terminalStop || state === "closed" || state === "stopping") {
                    setStatus("Stopped");
                    transition("closed");
                    return;
                }
                scheduleReconnect();
            });

            ws.addEventListener("error", () => {
                if (socket !== ws) return;
                setStatus("Connection error");
            });
        }

        window.addEventListener("beforeunload", () => {
            terminalStop = true;
            clearReconnectTimer();
            closePeer();
            closeSocketAndClearReference();
        });

        connect();
    </script>
</body>
</html>
