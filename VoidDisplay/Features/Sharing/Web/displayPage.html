<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__PAGE_TITLE__</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b11;
            --panel: rgba(255, 255, 255, 0.08);
            --text: #f7f9fd;
            --muted: rgba(247, 249, 253, 0.65);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "SF Pro Display", "Helvetica Neue", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(143, 211, 255, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(51, 101, 196, 0.18), transparent 38%),
                linear-gradient(160deg, #080b11, #0d1728 55%, #060910);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .shell {
            width: min(96vw, 1600px);
            display: grid;
            gap: 18px;
        }
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: var(--panel);
            backdrop-filter: blur(18px);
        }
        .eyebrow {
            margin: 0 0 6px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }
        h1 {
            margin: 0;
            font-size: clamp(22px, 2.4vw, 34px);
            line-height: 1.05;
        }
        .status {
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--muted);
        }
        .stage {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #000;
            min-height: min(70vh, 900px);
            box-shadow: 0 36px 90px rgba(0, 0, 0, 0.45);
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(180deg, rgba(6, 9, 16, 0.22), rgba(6, 9, 16, 0.72));
            text-align: center;
        }
        .overlay[hidden] { display: none; }
        .card {
            max-width: 520px;
            padding: 24px;
            border-radius: 22px;
            background: rgba(8, 11, 17, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card h2 { margin: 0 0 10px; }
        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }
        .footnote {
            font-size: 13px;
            color: var(--muted);
            padding: 0 8px;
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div>
                <p class="eyebrow">VoidDisplay Live</p>
                <h1>__PAGE_TITLE__</h1>
            </div>
            <div class="status" id="status">Connecting…</div>
        </section>

        <section class="stage">
            <video id="player" autoplay playsinline muted></video>
            <div class="overlay" id="overlay">
                <div class="card">
                    <h2 id="message-title">Connecting…</h2>
                    <p id="message-body">Preparing the WebRTC stream.</p>
                </div>
            </div>
        </section>

        <p class="footnote">This page requires RTCPeerConnection and WebSocket support.</p>
    </div>

    <script>
        const signalPath = "__SIGNAL_PATH__";
        const statusEl = document.getElementById("status");
        const overlayEl = document.getElementById("overlay");
        const messageTitleEl = document.getElementById("message-title");
        const messageBodyEl = document.getElementById("message-body");
        const player = document.getElementById("player");

        let socket = null;
        let peer = null;
        let reconnectIndex = 0;
        const reconnectDelays = [200, 500, 1000, 1500];

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function setOverlay(title, body, visible = true) {
            messageTitleEl.textContent = title;
            messageBodyEl.textContent = body;
            overlayEl.hidden = !visible;
        }

        function closePeer() {
            if (peer) {
                peer.ontrack = null;
                peer.onicecandidate = null;
                peer.onconnectionstatechange = null;
                peer.close();
                peer = null;
            }
            player.srcObject = null;
        }

        function scheduleReconnect() {
            const delay = reconnectDelays[Math.min(reconnectIndex, reconnectDelays.length - 1)];
            reconnectIndex += 1;
            setStatus(`Reconnecting in ${delay}ms`);
            setOverlay("Reconnecting…", "The signaling channel dropped. Retrying automatically.", true);
            window.setTimeout(connect, delay);
        }

        async function sendSignal(payload) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify(payload));
        }

        async function startPeerConnection() {
            closePeer();
            peer = new RTCPeerConnection({ iceServers: [] });

            peer.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    player.srcObject = event.streams[0];
                    setStatus("Live");
                    setOverlay("Live stream", "Connected and receiving frames.", false);
                }
            };

            peer.onicecandidate = (event) => {
                if (!event.candidate) {
                    sendSignal({ type: "ice_complete" });
                    return;
                }
                sendSignal({
                    type: "ice_candidate",
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex
                });
            };

            peer.onconnectionstatechange = () => {
                if (peer.connectionState === "failed" || peer.connectionState === "disconnected") {
                    setStatus("Connection lost");
                    setOverlay("Connection lost", "Trying to reconnect to the stream.", true);
                }
            };

            const offer = await peer.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: true
            });
            await peer.setLocalDescription(offer);
            await sendSignal({ type: "offer", sdp: offer.sdp });
        }

        function connect() {
            if (!window.WebSocket) {
                setStatus("Unsupported browser");
                setOverlay("WebSocket required", "This browser cannot open signaling transport.", true);
                return;
            }
            if (!window.RTCPeerConnection) {
                setStatus("Unsupported browser");
                setOverlay("WebRTC required", "This browser does not support RTCPeerConnection.", true);
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const wsUrl = `${protocol}://${window.location.host}${signalPath}`;
            socket = new WebSocket(wsUrl);
            setStatus("Connecting…");
            setOverlay("Connecting…", "Preparing the WebRTC signaling channel.", true);

            socket.addEventListener("open", async () => {
                reconnectIndex = 0;
                setStatus("Signaling connected");
                await sendSignal({ type: "viewer_ready" });
                try {
                    await startPeerConnection();
                    setOverlay("Negotiating…", "Exchanging offer/answer and ICE candidates.", true);
                } catch (error) {
                    setStatus("Negotiation failed");
                    setOverlay("Negotiation failed", error?.message || "Failed to create WebRTC offer.", true);
                }
            });

            socket.addEventListener("message", async (event) => {
                if (typeof event.data !== "string") {
                    return;
                }

                let payload;
                try {
                    payload = JSON.parse(event.data);
                } catch {
                    return;
                }

                if (!payload || typeof payload.type !== "string") {
                    return;
                }

                switch (payload.type) {
                    case "answer":
                        if (!peer || typeof payload.sdp !== "string") return;
                        await peer.setRemoteDescription({
                            type: "answer",
                            sdp: payload.sdp
                        });
                        setStatus("Connected");
                        break;
                    case "ice_candidate":
                        if (!peer || typeof payload.candidate !== "string") return;
                        await peer.addIceCandidate({
                            candidate: payload.candidate,
                            sdpMid: payload.sdpMid || null,
                            sdpMLineIndex: Number.isInteger(payload.sdpMLineIndex) ? payload.sdpMLineIndex : 0
                        });
                        break;
                    case "stopped":
                        setStatus("Stopped");
                        setOverlay("Sharing stopped", "The source stream is no longer available.", true);
                        closePeer();
                        socket.close();
                        break;
                    case "error":
                        setStatus("Error");
                        setOverlay("Stream error", payload.reason || "Unknown signaling error.", true);
                        break;
                    default:
                        break;
                }
            });

            socket.addEventListener("close", () => {
                closePeer();
                scheduleReconnect();
            });

            socket.addEventListener("error", () => {
                setStatus("Connection error");
            });
        }

        connect();
    </script>
</body>
</html>
