<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__PAGE_TITLE__</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b11;
            --panel: rgba(255, 255, 255, 0.08);
            --text: #f7f9fd;
            --muted: rgba(247, 249, 253, 0.65);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            font-family: "SF Pro Display", "Helvetica Neue", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(143, 211, 255, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(51, 101, 196, 0.18), transparent 38%),
                linear-gradient(160deg, #080b11, #0d1728 55%, #060910);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 12px;
            overflow: hidden;
        }
        .shell {
            width: 98vw;
            height: calc(100vh - 24px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 12px;
        }
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: var(--panel);
            backdrop-filter: blur(18px);
        }
        .hero-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .eyebrow {
            margin: 0 0 6px;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }
        h1 {
            margin: 0;
            font-size: clamp(22px, 2.4vw, 34px);
            line-height: 1.05;
        }
        .status {
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--muted);
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        .control-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 8px 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .stage {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #000;
            min-height: 0;
            box-shadow: 0 36px 90px rgba(0, 0, 0, 0.45);
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(180deg, rgba(6, 9, 16, 0.22), rgba(6, 9, 16, 0.72));
            text-align: center;
        }
        .overlay[hidden] { display: none; }
        .card {
            max-width: 520px;
            padding: 24px;
            border-radius: 22px;
            background: rgba(8, 11, 17, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card h2 { margin: 0 0 10px; }
        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }
        .footnote {
            font-size: 13px;
            color: var(--muted);
            padding: 0 8px;
        }
        body.mode-native {
            height: auto;
            min-height: 100vh;
            overflow: auto;
        }
        body.mode-native .shell {
            height: auto;
            min-height: calc(100vh - 24px);
        }
        body.mode-native .stage {
            overflow: auto;
            display: block;
        }
        body.mode-native video {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            margin: 0 auto;
        }
        @media (max-height: 860px) {
            .hero {
                padding: 12px 16px;
            }
            h1 {
                font-size: clamp(18px, 2vw, 28px);
            }
            .footnote {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div>
                <p class="eyebrow" id="hero-eyebrow">VoidDisplay Live</p>
            </div>
            <div class="hero-actions">
                <div class="status" id="status">Connecting…</div>
                <div class="controls">
                    <button class="control-btn" id="scale-mode-btn" type="button">1:1</button>
                    <button class="control-btn" id="fullscreen-btn" type="button">Fullscreen</button>
                </div>
            </div>
        </section>

        <section class="stage">
            <video id="player" autoplay playsinline muted></video>
            <div class="overlay" id="overlay">
                <div class="card">
                    <h2 id="message-title">Connecting…</h2>
                    <p id="message-body">Preparing the WebRTC stream.</p>
                </div>
            </div>
        </section>

        <p class="footnote" id="footnote">Use `1:1` for original size and `Fullscreen` for immersive view.</p>
    </div>

    <script id="voiddisplay-bootstrap" type="application/json">__BOOTSTRAP_JSON__</script>
    <script>
        const signalPath = "__SIGNAL_PATH__";
        const bootstrapEl = document.getElementById("voiddisplay-bootstrap");
        const statusEl = document.getElementById("status");
        const overlayEl = document.getElementById("overlay");
        const messageTitleEl = document.getElementById("message-title");
        const messageBodyEl = document.getElementById("message-body");
        const heroEyebrowEl = document.getElementById("hero-eyebrow");
        const footnoteEl = document.getElementById("footnote");
        const player = document.getElementById("player");
        const stage = document.querySelector(".stage");
        const scaleModeBtn = document.getElementById("scale-mode-btn");
        const fullscreenBtn = document.getElementById("fullscreen-btn");

        let socket = null;
        let peer = null;
        let reconnectIndex = 0;
        let reconnectTimer = null;
        var terminalStop = false;
        let state = "idle";
        let originalScaleEnabled = false;
        const reconnectDelays = [250, 500, 1000, 2000, 4000];
        const messages = {
            en: {
                pageTitle: "Screen Share",
                heroEyebrow: "VoidDisplay Live",
                statusConnecting: "Connecting…",
                statusSignalingConnected: "Signaling connected",
                statusConnected: "Connected",
                statusLive: "Live",
                statusConnectionLost: "Connection lost",
                statusUnsupportedBrowser: "Unsupported browser",
                statusNegotiationFailed: "Negotiation failed",
                statusStopped: "Stopped",
                statusError: "Error",
                statusConnectionError: "Connection error",
                statusReconnecting: (delay) => `Reconnecting in ${delay}ms`,
                scaleFit: "Fit",
                scaleOriginal: "1:1",
                fullscreenEnter: "Fullscreen",
                fullscreenExit: "Exit Fullscreen",
                overlayConnectingTitle: "Connecting…",
                overlayConnectingBody: "Preparing the WebRTC signaling channel.",
                overlayNegotiatingTitle: "Negotiating…",
                overlayNegotiatingBody: "Exchanging offer/answer and ICE candidates.",
                overlayLiveTitle: "Live stream",
                overlayLiveBody: "Connected and receiving frames.",
                overlayReconnectTitle: "Reconnecting…",
                overlayReconnectBody: "The signaling channel dropped. Retrying automatically.",
                overlayConnectionLostTitle: "Connection lost",
                overlayConnectionLostBody: "Trying to reconnect to the stream.",
                overlayWebSocketRequiredTitle: "WebSocket required",
                overlayWebSocketRequiredBody: "This browser cannot open signaling transport.",
                overlayWebRTCRequiredTitle: "WebRTC required",
                overlayWebRTCRequiredBody: "This browser does not support RTCPeerConnection.",
                overlayH264RequiredTitle: "H.264 required",
                overlayH264RequiredBody: "This browser or device did not expose H.264 for WebRTC playback.",
                overlayH264AnswerRequiredBody: "The WebRTC answer did not negotiate H.264 video.",
                overlayH264StatsRequiredBody: "The browser did not confirm an H.264 decoder in WebRTC stats.",
                overlayNegotiationFailedTitle: "Negotiation failed",
                overlayNegotiationFailedFallback: "Failed to create WebRTC offer.",
                overlaySharingStoppedTitle: "Sharing stopped",
                overlaySharingStoppedBody: "The source stream is no longer available.",
                overlayStreamErrorTitle: "Stream error",
                overlayStreamErrorFallback: "Unknown signaling error.",
                footnote: "Use `1:1` for original size and `Fullscreen` for immersive view."
            },
            zhHans: {
                pageTitle: "屏幕共享",
                heroEyebrow: "VOIDDISPLAY 实时画面",
                statusConnecting: "连接中…",
                statusSignalingConnected: "信令已连接",
                statusConnected: "已连接",
                statusLive: "直播中",
                statusConnectionLost: "连接已断开",
                statusUnsupportedBrowser: "浏览器不受支持",
                statusNegotiationFailed: "协商失败",
                statusStopped: "已停止",
                statusError: "发生错误",
                statusConnectionError: "连接出错",
                statusReconnecting: (delay) => `${delay}ms 后重连`,
                scaleFit: "适应",
                scaleOriginal: "1:1",
                fullscreenEnter: "全屏",
                fullscreenExit: "退出全屏",
                overlayConnectingTitle: "连接中…",
                overlayConnectingBody: "正在准备 WebRTC 信令通道。",
                overlayNegotiatingTitle: "协商中…",
                overlayNegotiatingBody: "正在交换 offer、answer 和 ICE 候选。",
                overlayLiveTitle: "实时画面",
                overlayLiveBody: "已连接并开始接收画面。",
                overlayReconnectTitle: "正在重连…",
                overlayReconnectBody: "信令通道已断开，正在自动重试。",
                overlayConnectionLostTitle: "连接已断开",
                overlayConnectionLostBody: "正在尝试重新连接画面流。",
                overlayWebSocketRequiredTitle: "需要 WebSocket",
                overlayWebSocketRequiredBody: "当前浏览器无法建立信令传输通道。",
                overlayWebRTCRequiredTitle: "需要 WebRTC",
                overlayWebRTCRequiredBody: "当前浏览器不支持 RTCPeerConnection。",
                overlayH264RequiredTitle: "需要 H.264",
                overlayH264RequiredBody: "当前浏览器或设备未暴露 WebRTC H.264 播放能力。",
                overlayH264AnswerRequiredBody: "WebRTC answer 未协商到 H.264 视频。",
                overlayH264StatsRequiredBody: "浏览器 WebRTC stats 未确认 H.264 解码器。",
                overlayNegotiationFailedTitle: "协商失败",
                overlayNegotiationFailedFallback: "创建 WebRTC offer 失败。",
                overlaySharingStoppedTitle: "共享已停止",
                overlaySharingStoppedBody: "源端画面已不可用。",
                overlayStreamErrorTitle: "画面错误",
                overlayStreamErrorFallback: "发生未知信令错误。",
                footnote: "使用“1:1”查看原始尺寸，使用“全屏”进入沉浸式观看。"
            }
        };

        function resolveLocale() {
            const preferredLocales = Array.isArray(navigator.languages) && navigator.languages.length > 0
                ? navigator.languages
                : [navigator.language || "en"];
            for (const locale of preferredLocales) {
                const normalized = String(locale || "").toLowerCase();
                if (
                    normalized === "zh-hans" ||
                    normalized === "zh-cn" ||
                    normalized === "zh-sg" ||
                    normalized.startsWith("zh")
                ) {
                    return "zhHans";
                }
            }
            return "en";
        }

        const locale = resolveLocale();
        const currentMessages = messages[locale] || messages.en;

        function t(key, ...args) {
            const value = currentMessages[key];
            if (typeof value === "function") {
                return value(...args);
            }
            return value ?? messages.en[key] ?? "";
        }

        const bootstrap = (() => {
            if (!bootstrapEl?.textContent) {
                return { iceServers: [] };
            }
            try {
                const parsed = JSON.parse(bootstrapEl.textContent);
                const iceServers = Array.isArray(parsed?.iceServers) ? parsed.iceServers : [];
                return { iceServers };
            } catch {
                return { iceServers: [] };
            }
        })();
        const localOfferIceTimeoutMs = 2000;
        const h264StatsConfirmationTimeoutMs = 10000;
        const h264StatsPollIntervalMs = 100;

        function applyStaticCopy() {
            document.title = t("pageTitle");
            if (heroEyebrowEl) {
                heroEyebrowEl.textContent = t("heroEyebrow");
            }
            if (footnoteEl) {
                footnoteEl.textContent = t("footnote");
            }
        }

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function transition(nextState) {
            state = nextState;
        }

        function setOverlay(title, body, visible = true) {
            messageTitleEl.textContent = title;
            messageBodyEl.textContent = body;
            overlayEl.hidden = !visible;
        }

        function applyScaleMode() {
            document.body.classList.toggle("mode-native", originalScaleEnabled);
            if (scaleModeBtn) {
                scaleModeBtn.textContent = originalScaleEnabled ? t("scaleFit") : t("scaleOriginal");
            }
        }

        function syncFullscreenButtonLabel() {
            if (!fullscreenBtn) return;
            fullscreenBtn.textContent = document.fullscreenElement ? t("fullscreenExit") : t("fullscreenEnter");
        }

        async function toggleFullscreen() {
            if (!document.fullscreenEnabled || !stage) return;
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else {
                    await stage.requestFullscreen();
                }
            } catch {
                // no-op: button state will remain unchanged
            }
        }

        scaleModeBtn?.addEventListener("click", () => {
            originalScaleEnabled = !originalScaleEnabled;
            applyScaleMode();
        });

        fullscreenBtn?.addEventListener("click", () => {
            toggleFullscreen();
        });

        document.addEventListener("fullscreenchange", syncFullscreenButtonLabel);
        applyStaticCopy();
        applyScaleMode();
        syncFullscreenButtonLabel();

        function closePeer() {
            if (peer) {
                peer.ontrack = null;
                peer.onicecandidate = null;
                peer.onconnectionstatechange = null;
                peer.close();
                peer = null;
            }
            player.srcObject = null;
        }

        function isSocketConnectingOrOpen(ws) {
            if (!ws) return false;
            return ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN;
        }

        function closeSocketAndClearReference() {
            const ws = socket;
            if (!ws) return;
            socket = null;
            try {
                ws.close();
            } catch {
                // no-op
            }
        }

        function clearReconnectTimer() {
            if (reconnectTimer) {
                window.clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
        }

        function scheduleReconnect() {
            if (terminalStop || state === "stopping" || state === "closed") {
                return;
            }
            if (reconnectTimer) {
                return;
            }
            const delay = reconnectDelays[Math.min(reconnectIndex, reconnectDelays.length - 1)];
            reconnectIndex += 1;
            setStatus(t("statusReconnecting", delay));
            setOverlay(t("overlayReconnectTitle"), t("overlayReconnectBody"), true);
            transition("handshaking");
            reconnectTimer = window.setTimeout(() => {
                reconnectTimer = null;
                connect();
            }, delay);
        }

        async function sendSignal(payload) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify(payload));
        }

        function localOfferSDPWithIceCredentials() {
            const localDescription = peer?.localDescription;
            if (
                !localDescription ||
                localDescription.type !== "offer" ||
                typeof localDescription.sdp !== "string" ||
                localDescription.sdp.length === 0
            ) {
                return null;
            }
            if (!/(^|\r?\n)a=ice-ufrag:/u.test(localDescription.sdp)) {
                return null;
            }
            return localDescription.sdp;
        }

        async function waitForLocalOfferSDP() {
            const startedAt = performance.now();
            while (performance.now() - startedAt < localOfferIceTimeoutMs) {
                const sdp = localOfferSDPWithIceCredentials();
                if (sdp) {
                    return sdp;
                }
                await new Promise((resolve) => window.setTimeout(resolve, 25));
            }
            throw new Error("Local WebRTC offer is missing ICE credentials.");
        }

        function isH264Codec(codec) {
            return String(codec?.mimeType || "").toLowerCase() === "video/h264";
        }

        function h264ReceiverCodecPreferences() {
            if (!window.RTCRtpReceiver || typeof RTCRtpReceiver.getCapabilities !== "function") {
                return null;
            }
            const capabilities = RTCRtpReceiver.getCapabilities("video");
            const codecs = Array.isArray(capabilities?.codecs)
                ? capabilities.codecs.filter(isH264Codec)
                : [];
            if (codecs.length === 0) {
                throw new Error(t("overlayH264RequiredBody"));
            }
            return codecs;
        }

        function videoCodecNamesFromSDP(sdp) {
            const lines = String(sdp || "").split(/\r?\n/u);
            const payloadTypes = [];
            const namesByPayloadType = new Map();
            let inVideo = false;

            for (const line of lines) {
                if (line.startsWith("m=")) {
                    inVideo = line.startsWith("m=video ");
                    if (inVideo) {
                        payloadTypes.length = 0;
                        const parts = line.trim().split(/\s+/u);
                        payloadTypes.push(...parts.slice(3));
                    }
                    continue;
                }
                if (!inVideo || !line.startsWith("a=rtpmap:")) continue;
                const match = /^a=rtpmap:(\d+)\s+([^/\s]+)/iu.exec(line);
                if (match) {
                    namesByPayloadType.set(match[1], match[2].toLowerCase());
                }
            }

            return payloadTypes
                .map((payloadType) => namesByPayloadType.get(payloadType))
                .filter(Boolean);
        }

        function assertH264AnswerSDP(sdp) {
            const codecNames = videoCodecNamesFromSDP(sdp);
            const hasH264 = codecNames.some((name) => name === "h264");
            const hasUnexpectedVideoCodec = codecNames.some((name) => name !== "h264" && name !== "rtx");
            if (!hasH264 || hasUnexpectedVideoCodec) {
                throw new Error(t("overlayH264AnswerRequiredBody"));
            }
        }

        function failH264Requirement(error) {
            terminalStop = true;
            setStatus(t("statusNegotiationFailed"));
            setOverlay(
                t("overlayH264RequiredTitle"),
                error?.message || t("overlayH264RequiredBody"),
                true
            );
            clearReconnectTimer();
            closePeer();
            closeSocketAndClearReference();
            transition("closed");
        }

        async function verifySelectedH264Codec() {
            if (!peer || typeof peer.getStats !== "function") {
                throw new Error(t("overlayH264StatsRequiredBody"));
            }

            const startedAt = performance.now();
            while (performance.now() - startedAt < h264StatsConfirmationTimeoutMs) {
                const stats = await peer.getStats();
                const reports = new Map();
                stats.forEach((report) => reports.set(report.id, report));
                for (const report of reports.values()) {
                    const reportKind = report.kind || report.mediaType;
                    if (
                        report.type !== "inbound-rtp" ||
                        reportKind !== "video" ||
                        !report.codecId
                    ) {
                        continue;
                    }
                    const codec = reports.get(report.codecId);
                    if (!codec?.mimeType) continue;
                    if (String(codec.mimeType).toLowerCase() === "video/h264") {
                        return;
                    }
                    throw new Error(t("overlayH264StatsRequiredBody"));
                }
                await new Promise((resolve) => window.setTimeout(resolve, h264StatsPollIntervalMs));
            }
            throw new Error(t("overlayH264StatsRequiredBody"));
        }

        async function startPeerConnection() {
            closePeer();
            peer = new RTCPeerConnection({ iceServers: bootstrap.iceServers ?? [] });
            let usesTransceiverOffer = false;
            const h264Preferences = h264ReceiverCodecPreferences();
            if (typeof peer.addTransceiver === "function") {
                const transceiver = peer.addTransceiver("video", { direction: "recvonly" });
                if (
                    h264Preferences &&
                    typeof transceiver.setCodecPreferences === "function"
                ) {
                    transceiver.setCodecPreferences(h264Preferences);
                }
                usesTransceiverOffer = true;
            }

            peer.ontrack = async (event) => {
                if (event.streams && event.streams[0]) {
                    player.srcObject = event.streams[0];
                    try {
                        await verifySelectedH264Codec();
                        setStatus(t("statusLive"));
                        setOverlay(t("overlayLiveTitle"), t("overlayLiveBody"), false);
                        transition("streaming");
                    } catch (error) {
                        failH264Requirement(error);
                    }
                }
            };

            peer.onicecandidate = (event) => {
                if (!event.candidate) {
                    sendSignal({ type: "ice_complete" });
                    return;
                }
                sendSignal({
                    type: "ice_candidate",
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex
                });
            };

            peer.onconnectionstatechange = () => {
                if (peer.connectionState === "failed" || peer.connectionState === "disconnected") {
                    setStatus(t("statusConnectionLost"));
                    setOverlay(t("overlayConnectionLostTitle"), t("overlayConnectionLostBody"), true);
                    if (!terminalStop) {
                        closeSocketAndClearReference();
                        scheduleReconnect();
                    }
                }
            };

            const offer = usesTransceiverOffer
                ? await peer.createOffer()
                : await peer.createOffer({
                    offerToReceiveAudio: false,
                    offerToReceiveVideo: true
                });
            await peer.setLocalDescription(offer);
            await sendSignal({ type: "offer", sdp: await waitForLocalOfferSDP() });
            transition("negotiating");
        }

        function connect() {
            if (terminalStop || state === "closed") {
                return;
            }
            if (isSocketConnectingOrOpen(socket)) {
                return;
            }
            if (!window.WebSocket) {
                setStatus(t("statusUnsupportedBrowser"));
                setOverlay(t("overlayWebSocketRequiredTitle"), t("overlayWebSocketRequiredBody"), true);
                transition("closed");
                return;
            }
            if (!window.RTCPeerConnection) {
                setStatus(t("statusUnsupportedBrowser"));
                setOverlay(t("overlayWebRTCRequiredTitle"), t("overlayWebRTCRequiredBody"), true);
                transition("closed");
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const wsUrl = `${protocol}://${window.location.host}${signalPath}`;
            const ws = new WebSocket(wsUrl);
            socket = ws;
            transition("handshaking");
            setStatus(t("statusConnecting"));
            setOverlay(t("overlayConnectingTitle"), t("overlayConnectingBody"), true);

            ws.addEventListener("open", async () => {
                if (socket !== ws) return;
                reconnectIndex = 0;
                clearReconnectTimer();
                transition("signalingReady");
                setStatus(t("statusSignalingConnected"));
                await sendSignal({ type: "viewer_ready" });
                try {
                    await startPeerConnection();
                    setOverlay(t("overlayNegotiatingTitle"), t("overlayNegotiatingBody"), true);
                } catch (error) {
                    setStatus(t("statusNegotiationFailed"));
                    setOverlay(
                        t("overlayNegotiationFailedTitle"),
                        error?.message || t("overlayNegotiationFailedFallback"),
                        true
                    );
                    closeSocketAndClearReference();
                    scheduleReconnect();
                }
            });

            ws.addEventListener("message", async (event) => {
                if (socket !== ws) return;
                if (typeof event.data !== "string") {
                    return;
                }

                let payload;
                try {
                    payload = JSON.parse(event.data);
                } catch {
                    return;
                }

                if (!payload || typeof payload.type !== "string") {
                    return;
                }

                switch (payload.type) {
                    case "answer":
                        if (!peer || typeof payload.sdp !== "string") return;
                        try {
                            assertH264AnswerSDP(payload.sdp);
                            await peer.setRemoteDescription({
                                type: "answer",
                                sdp: payload.sdp
                            });
                            setStatus(t("statusConnected"));
                        } catch (error) {
                            failH264Requirement(error);
                        }
                        break;
                    case "ice_candidate":
                        if (!peer || typeof payload.candidate !== "string") return;
                        await peer.addIceCandidate({
                            candidate: payload.candidate,
                            sdpMid: payload.sdpMid || null,
                            sdpMLineIndex: Number.isInteger(payload.sdpMLineIndex) ? payload.sdpMLineIndex : 0
                        });
                        break;
                    case "stopped":
                        terminalStop = true;
                        transition("stopping");
                        setStatus(t("statusStopped"));
                        setOverlay(t("overlaySharingStoppedTitle"), t("overlaySharingStoppedBody"), true);
                        closePeer();
                        clearReconnectTimer();
                        closeSocketAndClearReference();
                        transition("closed");
                        break;
                    case "error":
                        terminalStop = true;
                        setStatus(t("statusError"));
                        setOverlay(t("overlayStreamErrorTitle"), payload.reason || t("overlayStreamErrorFallback"), true);
                        clearReconnectTimer();
                        closePeer();
                        closeSocketAndClearReference();
                        transition("closed");
                        break;
                    default:
                        break;
                }
            });

            ws.addEventListener("close", () => {
                if (socket !== ws) return;
                socket = null;
                closePeer();
                if (terminalStop || state === "closed" || state === "stopping") {
                    setStatus(t("statusStopped"));
                    transition("closed");
                    return;
                }
                scheduleReconnect();
            });

            ws.addEventListener("error", () => {
                if (socket !== ws) return;
                setStatus(t("statusConnectionError"));
            });
        }

        window.addEventListener("beforeunload", () => {
            terminalStop = true;
            clearReconnectTimer();
            closePeer();
            closeSocketAndClearReference();
        });

        connect();
    </script>
</body>
</html>
