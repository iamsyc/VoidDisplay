<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__PAGE_TITLE__</title>
    <style>
__DISPLAY_PAGE_STYLES__
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div class="hero-brand">
                <p class="eyebrow" id="hero-eyebrow">VoidDisplay Live</p>
            </div>
            <div class="hero-metadata">
                <div class="video-info" id="video-info"></div>
                <div class="hero-actions">
                    <div class="controls">
                        <button class="control-btn" id="scale-mode-btn" type="button">1:1</button>
                        <button class="control-btn" id="fullscreen-btn" type="button">Fullscreen</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="stage">
            <video id="player" autoplay playsinline muted></video>
            <div class="overlay" id="overlay">
                <div class="loading-spinner" aria-label="Loading"></div>
            </div>
        </section>

        <footer class="footer">
            <p class="footnote" id="footnote">Use `1:1` for original size and `Fullscreen` for immersive view.</p>
            <div class="connection-status" id="connection-status">
                <div class="connection-status-title" id="connection-status-title">Connecting…</div>
                <div class="connection-status-detail" id="connection-status-detail">Preparing the WebRTC stream.</div>
            </div>
        </footer>
    </div>

    <script nonce="__SCRIPT_NONCE__" id="voiddisplay-bootstrap" type="application/json">__BOOTSTRAP_JSON__</script>
    <script nonce="__SCRIPT_NONCE__">
__DISPLAY_PAGE_MESSAGES_SCRIPT__
    </script>
    <script nonce="__SCRIPT_NONCE__">
__DISPLAY_PAGE_RUNTIME_SCRIPT__
    </script>
</body>
</html>
