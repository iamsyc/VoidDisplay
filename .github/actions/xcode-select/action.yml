name: Select Xcode
description: Select preferred Xcode and emit a cache suffix derived from Xcode version/build.

inputs:
  preferred_path:
    description: Preferred DEVELOPER_DIR path.
    required: false
    default: /Applications/Xcode_26.4.app/Contents/Developer
  fallback_path:
    description: Fallback DEVELOPER_DIR path when preferred path is unavailable.
    required: false
    default: /Applications/Xcode.app/Contents/Developer
  expected_xcode_version_prefix:
    description: Required Xcode version prefix.
    required: false
    default: "26.4"
  expected_swift_version_prefix:
    description: Required Swift version prefix.
    required: false
    default: "6."

outputs:
  xcode_cache_suffix:
    description: Xcode version/build suffix for cache keys.
    value: ${{ steps.select.outputs.xcode_cache_suffix }}

runs:
  using: composite
  steps:
    - id: select
      shell: bash
      run: |
        set -euo pipefail
        preferred="${{ inputs.preferred_path }}"
        fallback="${{ inputs.fallback_path }}"
        expected_xcode="${{ inputs.expected_xcode_version_prefix }}"
        expected_swift="${{ inputs.expected_swift_version_prefix }}"

        selected=""
        for candidate in "$preferred" "/Applications/Xcode-26.4.0.app/Contents/Developer" "/Applications/Xcode_26.4.app/Contents/Developer" "$fallback"; do
          if [ ! -d "$candidate" ]; then
            continue
          fi

          sudo xcode-select -s "$candidate"
          xcode_ver="$(xcodebuild -version | awk 'NR==1{print $2}')"
          swift_ver="$(swift --version | awk 'NR==1{print $4}')"

          case "$xcode_ver" in
            "$expected_xcode"*) ;;
            *)
              echo "Rejected Xcode at ${candidate}: Xcode=${xcode_ver}, expected prefix ${expected_xcode}"
              continue
              ;;
          esac

          case "$swift_ver" in
            "$expected_swift"*) ;;
            *)
              echo "Rejected Swift at ${candidate}: Swift=${swift_ver}, expected prefix ${expected_swift}"
              continue
              ;;
          esac

          selected="$candidate"
          break
        done

        if [ -z "$selected" ]; then
          echo "Required Xcode ${expected_xcode} with Swift ${expected_swift} was not found." >&2
          exit 1
        fi

        xcode_ver="$(xcodebuild -version | awk 'NR==1{print $2}')"
        xcode_build="$(xcodebuild -version | awk 'NR==2{print $3}')"
        echo "Selected Xcode ${xcode_ver} at ${selected}"
        echo "xcode_cache_suffix=xcode-${xcode_ver}-${xcode_build}" >> "$GITHUB_OUTPUT"
