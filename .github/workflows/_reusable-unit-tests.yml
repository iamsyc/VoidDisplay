name: _Reusable Unit Tests

on:
  workflow_call:
    inputs:
      artifact_retention_days:
        description: Artifact retention days.
        required: false
        type: number
        default: 7
    outputs:
      unit_status:
        description: Final unit test job status.
        value: ${{ jobs.unit_tests.outputs.unit_status }}
      artifact_name:
        description: Unit gate artifact name.
        value: ${{ jobs.unit_tests.outputs.artifact_name }}
      swift_test_count:
        description: SwiftPM test count parsed from the unit log.
        value: ${{ jobs.unit_tests.outputs.swift_test_count }}
      go_package_count:
        description: Go package count parsed from the unit log.
        value: ${{ jobs.unit_tests.outputs.go_package_count }}
      unit_reason:
        description: Unit gate failure classification.
        value: ${{ jobs.unit_tests.outputs.unit_reason }}

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      unit_status: ${{ steps.finalize.outputs.unit_status }}
      artifact_name: ${{ steps.finalize.outputs.artifact_name }}
      swift_test_count: ${{ steps.finalize.outputs.swift_test_count }}
      go_package_count: ${{ steps.finalize.outputs.go_package_count }}
      unit_reason: ${{ steps.finalize.outputs.unit_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            .build
          key: swiftpm-unit-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Tools/VoidDisplayRelay/**') }}
          restore-keys: |
            swiftpm-unit-${{ runner.os }}-

      - name: Run SwiftPM and Go unit gate
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/unit.sh" --out-dir .ai-tmp/unit-gate

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-gate
          path: .ai-tmp/unit-gate
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Set reusable outputs
        id: finalize
        if: always()
        shell: bash
        run: |
          summary_file=".ai-tmp/unit-gate/unit-summary.json"
          swift_test_count="0"
          go_package_count="0"
          unit_reason="not_run"

          if [ -f "$summary_file" ] && jq -e . "$summary_file" >/dev/null 2>&1; then
            swift_test_count="$(jq -r '.swift_test_count // 0' "$summary_file")"
            go_package_count="$(jq -r '.go_package_count // 0' "$summary_file")"
            unit_reason="$(jq -r '.reason // "unit_failed"' "$summary_file")"
          fi

          {
            echo "unit_status=${{ job.status }}"
            echo "artifact_name=unit-gate"
            echo "swift_test_count=${swift_test_count}"
            echo "go_package_count=${go_package_count}"
            echo "unit_reason=${unit_reason}"
          } >> "$GITHUB_OUTPUT"
