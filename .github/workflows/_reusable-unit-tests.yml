name: _Reusable Unit Tests

on:
  workflow_call:
    inputs:
      artifact_retention_days:
        description: Artifact retention days.
        required: false
        type: number
        default: 7
    outputs:
      unit_status:
        description: Final unit test job status.
        value: ${{ jobs.unit_tests.outputs.unit_status }}
      coverage_artifact_name:
        description: Coverage artifact name.
        value: ${{ jobs.unit_tests.outputs.coverage_artifact_name }}
      xcresult_artifact_name:
        description: SwiftPM test log artifact name.
        value: ${{ jobs.unit_tests.outputs.xcresult_artifact_name }}

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      unit_status: ${{ steps.finalize.outputs.unit_status }}
      coverage_artifact_name: ${{ steps.finalize.outputs.coverage_artifact_name }}
      xcresult_artifact_name: ${{ steps.finalize.outputs.xcresult_artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        id: xcode
        uses: ./.github/actions/xcode-select

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v5
        with:
          path: |
            .build
          key: swiftpm-unit-${{ runner.os }}-${{ steps.xcode.outputs.xcode_cache_suffix }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'scripts/test/**') }}
          restore-keys: |
            swiftpm-unit-${{ runner.os }}-${{ steps.xcode.outputs.xcode_cache_suffix }}-

      - name: Run unit tests (no signing)
        run: |
          chmod +x scripts/test/unit_gate.sh
          scripts/test/unit_gate.sh \
            --log-path .ai-tmp/unit-gate/unit-tests.log

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-log
          path: .ai-tmp/unit-gate/unit-tests.log
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Set reusable outputs
        id: finalize
        if: always()
        shell: bash
        run: |
          {
            echo "unit_status=${{ job.status }}"
            echo "coverage_artifact_name="
            echo "xcresult_artifact_name=unit-tests-log"
          } >> "$GITHUB_OUTPUT"
