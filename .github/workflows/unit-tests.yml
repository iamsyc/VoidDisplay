name: Unit Tests

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'VoidDisplay/**'
      - 'VoidDisplayTests/**'
      - 'VoidDisplay.xcodeproj/**'
      - 'scripts/test/**'
      - 'docs/testing/coverage-baseline.json'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'VoidDisplay/**'
      - 'VoidDisplayTests/**'
      - 'VoidDisplay.xcodeproj/**'
      - 'scripts/test/**'
      - 'docs/testing/coverage-baseline.json'
      - '.github/workflows/unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          preferred="/Applications/Xcode_16.2.app/Contents/Developer"
          fallback="/Applications/Xcode.app/Contents/Developer"
          if [ -d "$preferred" ]; then
            sudo xcode-select -s "$preferred"
          else
            echo "Preferred Xcode not found at ${preferred}; falling back to ${fallback}"
            sudo xcode-select -s "$fallback"
          fi
          xcode_ver="$(xcodebuild -version | awk 'NR==1{print $2}')"
          xcode_build="$(xcodebuild -version | awk 'NR==2{print $3}')"
          echo "xcode_cache_suffix=xcode-${xcode_ver}-${xcode_build}" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode metadata
        uses: actions/cache@v4
        with:
          path: |
            .derivedData/SourcePackages
            .derivedData/ModuleCache.noindex
          key: xcode-meta-unit-${{ runner.os }}-${{ steps.xcode.outputs.xcode_cache_suffix }}-${{ hashFiles('VoidDisplay.xcodeproj/**', 'scripts/test/**', '**/Package.resolved') }}
          restore-keys: |
            xcode-meta-unit-${{ runner.os }}-${{ steps.xcode.outputs.xcode_cache_suffix }}-
            xcode-meta-unit-${{ runner.os }}-

      - name: Run unit tests (no signing)
        run: |
          chmod +x scripts/test/unit_gate.sh scripts/test/coverage_report.sh scripts/test/coverage_guard.sh
          scripts/test/unit_gate.sh \
            --project "$GITHUB_WORKSPACE/VoidDisplay.xcodeproj" \
            --destination 'platform=macOS,arch=arm64' \
            --derived-data-path .derivedData \
            --result-bundle-path UnitTests.xcresult \
            --enable-code-coverage YES \
            --only-testing VoidDisplayTests \
            --skip-testing VoidDisplayUITests

      - name: Enforce coverage ratchet
        run: |
          scripts/test/coverage_guard.sh \
            --xcresult UnitTests.xcresult \
            --baseline docs/testing/coverage-baseline.json \
            --report docs/testing/coverage-latest.json

      - name: Upload unit test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-xcresult
          path: UnitTests.xcresult
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-coverage-report
          path: docs/testing/coverage-latest.json
          retention-days: 7
