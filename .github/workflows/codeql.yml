name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Tools/VoidDisplayRelay/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '**/Package.resolved'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '31 17 * * 2'
  workflow_dispatch:
    inputs:
      scan_swift:
        description: Attempt Swift scanning (Xcode 27 / Swift 6.4 is currently unsupported)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Restore automatic Swift coverage only after upstream Swift 6.4 support
        # and a successful repository analysis/upload. See docs/testing/ci-workflows.md.
        language: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scan_swift && '["go", "swift"]' || '["go"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: Tools/VoidDisplayRelay/go.mod
          cache-dependency-path: Tools/VoidDisplayRelay/go.sum

      - name: Select Xcode
        if: ${{ matrix.language == 'swift' }}
        uses: ./.github/actions/xcode-select

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build Swift
        if: ${{ matrix.language == 'swift' }}
        shell: bash
        run: swift build

      - name: Build Go
        if: ${{ matrix.language == 'go' }}
        shell: bash
        working-directory: Tools/VoidDisplayRelay
        run: go test ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4

      - name: Report scanning coverage
        if: ${{ always() && matrix.language == 'go' }}
        env:
          SWIFT_SCAN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_swift }}
        shell: bash
        run: |
          {
            echo '## CodeQL coverage'
            echo
            echo 'Go scanning is included in this run; inspect this job for its result.'
            echo
            if [[ "$SWIFT_SCAN_REQUESTED" == 'true' ]]; then
              echo 'Swift scanning was manually requested; inspect the analyze (swift) job for its result.'
            else
              echo '**Swift scanning was not run.** Automatic Swift scanning is paused because CodeQL does not support Xcode 27 / Swift 6.4.'
            fi
            echo
            echo 'Successful Go scanning does not establish Swift scanning coverage.'
            echo
            echo '[Upstream limitation](https://github.com/github/codeql/issues/22742#issuecomment-5949040893)'
            echo
            echo 'Restore automatic Swift scanning after official Swift 6.4 support and successful database creation, analysis, and upload for this repository.'
          } >> "$GITHUB_STEP_SUMMARY"
