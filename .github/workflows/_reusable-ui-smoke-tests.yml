name: _Reusable UI Smoke Tests

on:
  workflow_call:
    inputs:
      only_testing:
        description: Single xcodebuild -only-testing target used when only_testing_json is empty.
        required: false
        type: string
        default: VoidDisplayUITests/HomeSmokeTests/testHomeNavigationSmoke_baseline
      only_testing_json:
        description: JSON array of xcodebuild -only-testing targets executed together on one runner.
        required: false
        type: string
        default: '[]'
      max_attempts:
        description: Retry attempts for runner/bootstrap flakiness.
        required: false
        type: number
        default: 2
      artifact_retention_days:
        description: Artifact retention days.
        required: false
        type: number
        default: 7
      enforce_failure:
        description: Whether UI smoke failures should fail the job.
        required: false
        type: boolean
        default: true
      artifact_name_suffix:
        description: Suffix for artifact names to avoid collisions in matrix runs.
        required: false
        type: string
        default: default
    outputs:
      ui_status:
        description: Business-level UI smoke status.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_status }}
      ui_reason:
        description: Failure classification reason.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_reason }}
      ui_attempt:
        description: Last attempt index.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_attempt }}
      ui_max_attempts:
        description: Effective max attempts.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_max_attempts }}
      ui_log_file:
        description: Last attempt log filename.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_log_file }}

permissions:
  contents: read

jobs:
  ui_smoke_tests:
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      ui_status: ${{ steps.parse_summary.outputs.ui_status }}
      ui_reason: ${{ steps.parse_summary.outputs.ui_reason }}
      ui_attempt: ${{ steps.parse_summary.outputs.ui_attempt }}
      ui_max_attempts: ${{ steps.parse_summary.outputs.ui_max_attempts }}
      ui_log_file: ${{ steps.parse_summary.outputs.ui_log_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh" --profile ui-smoke

      - name: Cache Xcode module metadata
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .ai-tmp/ci-ui-smoke/DerivedData/ModuleCache.noindex
          key: xcode-meta-ui-${{ runner.os }}-${{ hashFiles('VoidDisplay.xcodeproj/**', '**/Package.resolved') }}

      - name: Run UI smoke
        id: run_ui
        continue-on-error: true
        shell: bash
        env:
          UI_SELECTOR: ${{ inputs.only_testing }}
          UI_SELECTORS_JSON: ${{ inputs.only_testing_json }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          ENFORCE_FAILURE: ${{ inputs.enforce_failure }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          selectors=()
          selector_args=()

          if ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
            <<< "$UI_SELECTORS_JSON" >/dev/null; then
            echo "only_testing_json must be a JSON array of non-empty strings." >&2
            exit 1
          fi

          while IFS= read -r selector; do
            selectors+=("$selector")
          done < <(jq -r '.[]' <<< "$UI_SELECTORS_JSON")

          if [ "${#selectors[@]}" -eq 0 ]; then
            [ -n "$UI_SELECTOR" ] || {
              echo "At least one UI selector is required." >&2
              exit 1
            }
            selectors+=("$UI_SELECTOR")
          fi

          for selector in "${selectors[@]}"; do
            selector_args+=(--only-testing "$selector")
          done

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/ui_smoke.sh" \
            "${selector_args[@]}" \
            --max-attempts "$MAX_ATTEMPTS" \
            --enforce-failure "$ENFORCE_FAILURE" \
            --out-dir .ai-tmp/ci-ui-smoke

      - name: Upload UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-smoke-${{ inputs.artifact_name_suffix }}
          path: .ai-tmp/ci-ui-smoke
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Parse UI smoke summary
        id: parse_summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary_file=".ai-tmp/ci-ui-smoke/ui-smoke-summary.json"
          ui_status="unknown"
          ui_reason="not_run"
          ui_attempt="0"
          ui_max_attempts="${{ inputs.max_attempts }}"
          ui_log_file=""

          if [ -f "$summary_file" ] && jq -e . "$summary_file" >/dev/null 2>&1; then
            raw_status="$(jq -r '.status // "unknown"' "$summary_file")"
            raw_reason="$(jq -r '.reason // "not_run"' "$summary_file")"
            ui_attempt="$(jq -r '.attempt // 0' "$summary_file")"
            ui_max_attempts="$(jq -r '.max_attempts // "${{ inputs.max_attempts }}"' "$summary_file")"
            ui_log_file="$(jq -r '.log_file // ""' "$summary_file")"
            case "$raw_status" in
              passed)
                ui_status="passed"
                ui_reason="none"
                ;;
              failed)
                case "$raw_reason" in
                  runner_bootstrap_failure|environment_unstable)
                    ui_status="unstable"
                    ui_reason="$raw_reason"
                    ;;
                  *)
                    ui_status="failed"
                    ui_reason="$raw_reason"
                    ;;
                esac
                ;;
              *)
                ui_status="unknown"
                ui_reason="$raw_reason"
                ;;
            esac
          fi

          {
            echo "ui_status=${ui_status}"
            echo "ui_reason=${ui_reason}"
            echo "ui_attempt=${ui_attempt}"
            echo "ui_max_attempts=${ui_max_attempts}"
            echo "ui_log_file=${ui_log_file}"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce UI smoke job semantics
        if: always()
        shell: bash
        env:
          ENFORCE_FAILURE: ${{ inputs.enforce_failure }}
          UI_STATUS: ${{ steps.parse_summary.outputs.ui_status }}
        run: |
          set -euo pipefail
          if [ "$ENFORCE_FAILURE" != "true" ]; then
            exit 0
          fi
          if [ "$UI_STATUS" = "passed" ]; then
            exit 0
          fi
          exit 1
