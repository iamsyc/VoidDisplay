name: _Reusable UI Smoke Tests

on:
  workflow_call:
    inputs:
      only_testing:
        description: xcodebuild -only-testing target.
        required: false
        type: string
        default: VoidDisplayUITests/HomeSmokeTests/testHomeNavigationSmoke_baseline
      max_attempts:
        description: Retry attempts for runner/bootstrap flakiness.
        required: false
        type: number
        default: 2
      artifact_retention_days:
        description: Artifact retention days.
        required: false
        type: number
        default: 7
      enforce_failure:
        description: Whether UI smoke failures (including unstable after retries) should fail the job.
        required: false
        type: boolean
        default: true
      artifact_name_suffix:
        description: Suffix for artifact names to avoid collisions in matrix runs.
        required: false
        type: string
        default: default
    outputs:
      ui_status:
        description: Business-level UI smoke status (passed/failed/unstable/unknown).
        value: ${{ jobs.ui_smoke_tests.outputs.ui_status }}
      ui_reason:
        description: Failure classification reason.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_reason }}
      ui_attempt:
        description: Last attempt index.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_attempt }}
      ui_max_attempts:
        description: Effective max attempts.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_max_attempts }}
      ui_log_file:
        description: Last attempt log filename.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_log_file }}
      ui_enforced_exit_code:
        description: Final enforced exit code for the UI smoke job semantics.
        value: ${{ jobs.ui_smoke_tests.outputs.ui_enforced_exit_code }}

permissions:
  contents: read

jobs:
  ui_smoke_tests:
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      ui_status: ${{ steps.parse_summary.outputs.ui_status }}
      ui_reason: ${{ steps.parse_summary.outputs.ui_reason }}
      ui_attempt: ${{ steps.parse_summary.outputs.ui_attempt }}
      ui_max_attempts: ${{ steps.parse_summary.outputs.ui_max_attempts }}
      ui_log_file: ${{ steps.parse_summary.outputs.ui_log_file }}
      ui_enforced_exit_code: ${{ steps.parse_summary.outputs.ui_enforced_exit_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        id: xcode
        uses: ./.github/actions/xcode-select

      - name: Cache Xcode metadata
        uses: actions/cache@v5
        with:
          path: |
            .derivedData/SourcePackages
            .derivedData/ModuleCache.noindex
          key: xcode-meta-ui-${{ runner.os }}-${{ steps.xcode.outputs.xcode_cache_suffix }}-${{ hashFiles('VoidDisplay.xcodeproj/**', '**/Package.resolved') }}
          restore-keys: |
            xcode-meta-ui-${{ runner.os }}-${{ steps.xcode.outputs.xcode_cache_suffix }}-

      - name: Run UI smoke test (no signing)
        id: run-ui
        continue-on-error: true
        shell: bash
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          classify_failure() {
            local log_file="$1"
            if grep -Eq "Early unexpected exit, operation never finished bootstrapping|Test crashed with signal kill before establishing connection" "$log_file"; then
              echo "runner_bootstrap_failure"
              return
            fi
            if grep -Eq "Assertion Failure|XCTAssert|Test Case '.*' failed" "$log_file"; then
              echo "assertion_failure"
              return
            fi
            if grep -Eq "XCTSkip|skip real-environment|environment not stable" "$log_file"; then
              echo "environment_unstable"
              return
            fi
            echo "unknown_failure"
          }

          write_summary() {
            local summary_status="$1"
            local summary_reason="$2"
            local summary_attempt="$3"
            local summary_log_file="$4"
            jq -n \
              --arg status "$summary_status" \
              --arg reason "$summary_reason" \
              --arg attempt "$summary_attempt" \
              --arg max_attempts "$max_attempts" \
              --arg log_file "$summary_log_file" \
              '{
                status: $status,
                reason: $reason,
                attempt: ($attempt | tonumber),
                max_attempts: ($max_attempts | tonumber),
                log_file: $log_file
              }' > "$summary_file"
          }

          summary_file="ui-smoke-summary.json"
          max_attempts="${MAX_ATTEMPTS}"
          if ! [[ "$max_attempts" =~ ^[0-9]+$ ]] || [ "$max_attempts" -lt 1 ] || [ "$max_attempts" -gt 5 ]; then
            echo "Invalid MAX_ATTEMPTS=${MAX_ATTEMPTS}; falling back to 2 (allowed range: 1-5)."
            max_attempts=2
          fi
          if [ -z "${ONLY_TESTING}" ]; then
            echo "ONLY_TESTING input is empty." >&2
            exit 1
          fi
          attempt=1
          last_reason="not_run"
          last_log_file=""

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "UI smoke attempt ${attempt}/${max_attempts}"
            log_file="ui-smoke-attempt-${attempt}.log"
            rm -rf UISmokeTests.xcresult

            set +e
            xcodebuild \
              -scheme VoidDisplay \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath .derivedData \
              -resultBundlePath UISmokeTests.xcresult \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              test \
              -only-testing:"${ONLY_TESTING}" \
              2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              if ! bash scripts/test/xcresult_test_count_guard.sh \
                --xcresult UISmokeTests.xcresult \
                --label "UI smoke attempt ${attempt}/${max_attempts}"; then
                write_summary "failed" "selector_mismatch" "$attempt" "$log_file"
                echo "UI smoke selector mismatch detected (0 tests executed)."
                exit 1
              fi
              write_summary "passed" "none" "$attempt" "$log_file"
              exit 0
            fi

            last_reason="$(classify_failure "$log_file")"
            last_log_file="$log_file"
            if [[ "$last_reason" == "assertion_failure" || "$last_reason" == "unknown_failure" ]]; then
              write_summary "failed" "$last_reason" "$attempt" "$log_file"
              echo "UI smoke failed (reason=${last_reason}); deterministic failure -> no retry."
              exit 1
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              echo "UI smoke failed (reason=${last_reason}), retrying once..."
            fi
          done

          write_summary "failed" "$last_reason" "$((attempt - 1))" "$last_log_file"

          if [[ "$last_reason" == "environment_unstable" || "$last_reason" == "runner_bootstrap_failure" ]]; then
            echo "UI smoke marked unstable (reason=${last_reason}); retries exhausted -> failing this run."
            exit 1
          fi

          echo "UI smoke failed after ${max_attempts} attempts."
          exit 1

      - name: Upload UI smoke test result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-tests-xcresult-${{ inputs.artifact_name_suffix }}
          path: UISmokeTests.xcresult
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Upload UI smoke failure summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-summary-${{ inputs.artifact_name_suffix }}
          path: |
            ui-smoke-summary.json
            ui-smoke-attempt-*.log
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Parse UI smoke summary
        id: parse_summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          summary_file="ui-smoke-summary.json"
          ui_status="unknown"
          ui_reason="not_run"
          ui_attempt="0"
          default_max_attempts='${{ inputs.max_attempts }}'
          ui_max_attempts="${default_max_attempts}"
          ui_log_file=""
          ui_enforced_exit_code="1"

          if [ -f "$summary_file" ] && jq -e . "$summary_file" >/dev/null 2>&1; then
            raw_status="$(jq -r '.status // "unknown"' "$summary_file")"
            raw_reason="$(jq -r '.reason // "not_run"' "$summary_file")"
            ui_attempt="$(jq -r '.attempt // 0' "$summary_file")"
            ui_max_attempts="$(jq -r --argjson default_max_attempts "${default_max_attempts}" '.max_attempts // $default_max_attempts' "$summary_file")"
            ui_log_file="$(jq -r '.log_file // ""' "$summary_file")"

            case "$raw_status" in
              passed)
                ui_status="passed"
                ui_reason="none"
                ui_enforced_exit_code="0"
                ;;
              failed)
                case "$raw_reason" in
                  runner_bootstrap_failure|environment_unstable)
                    ui_status="unstable"
                    ui_reason="$raw_reason"
                    ui_enforced_exit_code="1"
                    ;;
                  assertion_failure|unknown_failure)
                    ui_status="failed"
                    ui_reason="$raw_reason"
                    ui_enforced_exit_code="1"
                    ;;
                  *)
                    ui_status="unknown"
                    ui_reason="$raw_reason"
                    ui_enforced_exit_code="1"
                    ;;
                esac
                ;;
              *)
                ui_status="unknown"
                ui_reason="$raw_reason"
                ui_enforced_exit_code="1"
                ;;
            esac
          else
            if [ -f "$summary_file" ]; then
              ui_reason="invalid_summary_json"
            fi
          fi

          {
            echo "ui_status=${ui_status}"
            echo "ui_reason=${ui_reason}"
            echo "ui_attempt=${ui_attempt}"
            echo "ui_max_attempts=${ui_max_attempts}"
            echo "ui_log_file=${ui_log_file}"
            echo "ui_enforced_exit_code=${ui_enforced_exit_code}"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce UI smoke job semantics
        if: always()
        shell: bash
        env:
          ENFORCE_FAILURE: ${{ inputs.enforce_failure }}
          UI_STATUS: ${{ steps.parse_summary.outputs.ui_status }}
          UI_REASON: ${{ steps.parse_summary.outputs.ui_reason }}
          UI_ENFORCED_EXIT_CODE: ${{ steps.parse_summary.outputs.ui_enforced_exit_code }}
        run: |
          set -euo pipefail
          echo "UI smoke summary status=${UI_STATUS} reason=${UI_REASON} enforced_exit_code=${UI_ENFORCED_EXIT_CODE}"
          if [ "${ENFORCE_FAILURE}" != "true" ]; then
            echo "Failure enforcement disabled by caller; leaving job successful for informational mode."
            exit 0
          fi
          if [ "${UI_ENFORCED_EXIT_CODE}" = "0" ]; then
            exit 0
          fi
          exit 1
