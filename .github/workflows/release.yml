name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match v*.*.*)
        required: true
        type: string
      target_ref:
        description: Branch or commit SHA to tag
        required: false
        default: main
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'Apps/VoidDisplay/VoidDisplay.xcodeproj/project.pbxproj'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      tag: ${{ steps.prepare.outputs.tag }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      version: ${{ steps.prepare.outputs.version }}
      build_number: ${{ steps.prepare.outputs.build_number }}
    steps:
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
          fetch-depth: 0

      - name: Prepare release metadata
        id: prepare
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          project_file="Apps/VoidDisplay/VoidDisplay.xcodeproj/project.pbxproj"

          read_single_value() {
            local key="$1"
            local source="$2"
            local values=()

            mapfile -t values < <(
              sed -nE "s/^[[:space:]]*${key} = ([^;]+);/\1/p" "${source}" | sort -u
            )

            if [ "${#values[@]}" -ne 1 ]; then
              echo "Expected exactly one unique ${key}; found: ${values[*]:-<none>}" >&2
              exit 1
            fi

            printf '%s\n' "${values[0]}"
          }

          read_single_value_from_git() {
            local key="$1"
            local commit="$2"
            local path="$3"
            local values=()

            if ! git cat-file -e "${commit}:${path}" 2>/dev/null; then
              echo "Unable to read ${path} at ${commit}." >&2
              exit 1
            fi

            mapfile -t values < <(
              git show "${commit}:${path}" |
                sed -nE "s/^[[:space:]]*${key} = ([^;]+);/\1/p" |
                sort -u
            )

            if [ "${#values[@]}" -ne 1 ]; then
              echo "Expected exactly one unique ${key} at ${commit}; found: ${values[*]:-<none>}" >&2
              exit 1
            fi

            printf '%s\n' "${values[0]}"
          }

          ensure_tag_matches_target_if_present() {
            local release_tag="$1"
            local target_sha="$2"
            local existing_tag_sha=""

            git fetch --tags --force
            existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" 2>/dev/null || true)"

            if [ -n "${existing_tag_sha}" ] && [ "${existing_tag_sha}" != "${target_sha}" ]; then
              echo "Tag ${release_tag} already points to ${existing_tag_sha}, expected ${target_sha}." >&2
              exit 1
            fi
          }

          if [ ! -f "${project_file}" ]; then
            echo "Expected project file not found: ${project_file}" >&2
            exit 1
          fi

          target_sha="$(git rev-parse HEAD)"
          version="$(read_single_value MARKETING_VERSION "${project_file}")"
          build_number="$(read_single_value CURRENT_PROJECT_VERSION "${project_file}")"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid MARKETING_VERSION: ${version}. Expected format: MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ ! "${build_number}" =~ ^[0-9]+$ ]]; then
            echo "Invalid CURRENT_PROJECT_VERSION: ${build_number}. Expected a positive integer." >&2
            exit 1
          fi

          release_tag="v${version}"

          {
            echo "tag=${release_tag}"
            echo "target_sha=${target_sha}"
            echo "version=${version}"
            echo "build_number=${build_number}"
          } >> "${GITHUB_OUTPUT}"

          case "${EVENT_NAME}" in
            workflow_dispatch)
              if [[ ! "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Invalid input tag: ${INPUT_TAG}. Expected format: vMAJOR.MINOR.PATCH" >&2
                exit 1
              fi

              if [ "${INPUT_TAG}" != "${release_tag}" ]; then
                echo "Input tag ${INPUT_TAG} does not match MARKETING_VERSION ${version}." >&2
                exit 1
              fi

              ensure_tag_matches_target_if_present "${release_tag}" "${target_sha}"
              ;;
            push)
              if [ "${REF_TYPE}" = "tag" ]; then
                if [ "${REF_NAME}" != "${release_tag}" ]; then
                  echo "Tag ${REF_NAME} does not match MARKETING_VERSION ${version}." >&2
                  exit 1
                fi
                ensure_tag_matches_target_if_present "${release_tag}" "${target_sha}"
              elif [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" = "main" ]; then
                if [ -z "${BEFORE_SHA}" ] || [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
                  echo "Unable to compare against the previous main commit." >&2
                  exit 1
                fi

                previous_version="$(read_single_value_from_git MARKETING_VERSION "${BEFORE_SHA}" "${project_file}")"
                previous_build_number="$(read_single_value_from_git CURRENT_PROJECT_VERSION "${BEFORE_SHA}" "${project_file}")"

                if [ "${previous_version}" = "${version}" ]; then
                  echo "should_release=false" >> "${GITHUB_OUTPUT}"
                  echo "MARKETING_VERSION is unchanged at ${version}; skipping release."
                  exit 0
                fi

                if [[ ! "${previous_build_number}" =~ ^[0-9]+$ ]]; then
                  echo "Previous CURRENT_PROJECT_VERSION is invalid: ${previous_build_number}." >&2
                  exit 1
                fi

                if [ "${previous_build_number}" = "${build_number}" ]; then
                  echo "CURRENT_PROJECT_VERSION must change when MARKETING_VERSION changes." >&2
                  exit 1
                fi

                if [ "${build_number}" -le "${previous_build_number}" ]; then
                  echo "CURRENT_PROJECT_VERSION must increase from ${previous_build_number} to ${build_number}." >&2
                  exit 1
                fi

                ensure_tag_matches_target_if_present "${release_tag}" "${target_sha}"
              else
                echo "Unsupported push ref: ${REF_TYPE}/${REF_NAME}" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "Prepared release ${release_tag} from MARKETING_VERSION ${version}."

  build_dmg:
    name: build-dmg (${{ matrix.label }})
    needs:
      - prepare_release
    if: ${{ needs.prepare_release.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            arch: arm64
            runs_on: macos-26
          - label: intel64
            arch: x86_64
            runs_on: macos-26-intel
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.target_sha }}

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Build Release app (unsigned)
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme VoidDisplay \
            -project Apps/VoidDisplay/VoidDisplay.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ".ai-tmp/release-${LABEL}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS="${ARCH}" \
            build

      - name: Thin/sign/verify for target arch
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          app_path=".ai-tmp/release-${LABEL}/DerivedData/Build/Products/Release/VoidDisplay.app"
          if [ ! -d "${app_path}" ]; then
            echo "Expected app not found: ${app_path}"
            exit 1
          fi

          bash scripts/release/thin_webrtc_and_sign.sh "${app_path}" "${ARCH}"

      - name: Create DMG and checksum
        env:
          LABEL: ${{ matrix.label }}
          TAG: ${{ needs.prepare_release.outputs.tag }}
        run: |
          set -euo pipefail
          app_path=".ai-tmp/release-${LABEL}/DerivedData/Build/Products/Release/VoidDisplay.app"
          if [ ! -d "${app_path}" ]; then
            echo "Expected app not found: ${app_path}"
            exit 1
          fi

          dmg_name="VoidDisplay-${TAG}-${LABEL}.dmg"
          rm -rf release-assets
          mkdir -p release-assets
          chmod +x scripts/release/create_dmg.sh
          scripts/release/create_dmg.sh \
            "${app_path}" \
            "release-assets/${dmg_name}" \
            "VoidDisplay"

          shasum -a 256 "release-assets/${dmg_name}" > "release-assets/${dmg_name}.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dmg-${{ matrix.label }}
          path: |
            release-assets/*.dmg
            release-assets/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: publish-github-release
    needs:
      - prepare_release
      - build_dmg
    if: ${{ needs.prepare_release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare_release.outputs.target_sha }}
          fetch-depth: 0

      - name: Download packaged DMGs
        uses: actions/download-artifact@v8
        with:
          pattern: release-dmg-*
          merge-multiple: true
          path: release-assets

      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -lah release-assets
          test -n "$(ls -1 release-assets/*.dmg 2>/dev/null)"
          test -n "$(ls -1 release-assets/*.sha256 2>/dev/null)"

      - name: Ensure release tag
        env:
          TAG: ${{ needs.prepare_release.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare_release.outputs.target_sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          existing_tag_sha="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" 2>/dev/null || true)"

          if [ -n "${existing_tag_sha}" ]; then
            if [ "${existing_tag_sha}" != "${TARGET_SHA}" ]; then
              echo "Tag ${TAG} already points to ${existing_tag_sha}, expected ${TARGET_SHA}." >&2
              exit 1
            fi

            echo "Tag ${TAG} already points to ${TARGET_SHA}; continuing."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${TARGET_SHA}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed tag ${TAG}."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          target_commitish: ${{ needs.prepare_release.outputs.target_sha }}
          files: |
            release-assets/*.dmg
            release-assets/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          overwrite_files: false
