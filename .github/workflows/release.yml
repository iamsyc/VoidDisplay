name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match v*.*.*)
        required: true
        type: string
      target_ref:
        description: Branch or commit SHA to tag
        required: false
        default: main
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_tag:
    name: create-release-tag
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: ${TAG}. Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

      - name: Create and push annotated tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed tag ${TAG}. The tag-push run will publish the release."

  build_dmg:
    name: build-dmg (${{ matrix.label }})
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            arch: arm64
          - label: intel64
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Build Release app (unsigned)
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme VoidDisplay \
            -project VoidDisplay.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ".derivedData-release-${LABEL}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS="${ARCH}" \
            build

      - name: Thin/sign/verify for target arch
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          app_path=".derivedData-release-${LABEL}/Build/Products/Release/VoidDisplay.app"
          if [ ! -d "${app_path}" ]; then
            echo "Expected app not found: ${app_path}"
            exit 1
          fi

          bash scripts/release/thin_webrtc_and_sign.sh "${app_path}" "${ARCH}"

      - name: Create DMG and checksum
        env:
          LABEL: ${{ matrix.label }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app_path=".derivedData-release-${LABEL}/Build/Products/Release/VoidDisplay.app"
          if [ ! -d "${app_path}" ]; then
            echo "Expected app not found: ${app_path}"
            exit 1
          fi

          dmg_name="VoidDisplay-${TAG}-${LABEL}.dmg"
          rm -rf release-assets
          mkdir -p release-assets
          chmod +x scripts/release/create_dmg.sh
          scripts/release/create_dmg.sh \
            "${app_path}" \
            "release-assets/${dmg_name}" \
            "VoidDisplay"

          shasum -a 256 "release-assets/${dmg_name}" > "release-assets/${dmg_name}.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dmg-${{ matrix.label }}
          path: |
            release-assets/*.dmg
            release-assets/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: publish-github-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build_dmg
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged DMGs
        uses: actions/download-artifact@v8
        with:
          pattern: release-dmg-*
          merge-multiple: true
          path: release-assets

      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -lah release-assets
          test -n "$(ls -1 release-assets/*.dmg 2>/dev/null)"
          test -n "$(ls -1 release-assets/*.sha256 2>/dev/null)"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.dmg
            release-assets/*.sha256
          generate_release_notes: true
          make_latest: true
