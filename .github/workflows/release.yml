name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Recovery only, release tag matching the selected main commit
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'VoidDisplay.xcodeproj/project.pbxproj'
      - 'Tools/VoidDisplayRelay/**'
      - 'scripts/build-relay.sh'
      - 'scripts/ci/**'
      - 'scripts/dev/**'
      - 'scripts/lib/**'
      - 'scripts/release/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'Brewfile'
      - '.github/workflows/release.yml'
      - '.github/actions/xcode-select/action.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve_release_target:
    name: resolve-release-target
    runs-on: macos-26
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    permissions:
      contents: read
    steps:
      - name: Resolve release target
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          WORKFLOW_REF: ${{ github.ref }}
          SUMMARY_PATH: .ai-tmp/release-target/target-summary.json
        with:
          script: |
            const fs = require('fs/promises');
            const path = require('path');
            const { owner, repo } = context.repo;
            const eventName = process.env.EVENT_NAME;
            const inputTag = process.env.INPUT_TAG;
            const pushSha = process.env.PUSH_SHA;
            const workflowRef = process.env.WORKFLOW_REF;
            const summaryPath = process.env.SUMMARY_PATH;

            if (!['push', 'workflow_dispatch'].includes(eventName)) {
              throw new Error(`Unsupported release event: ${eventName}`);
            }
            if (eventName === 'workflow_dispatch' && workflowRef !== 'refs/heads/main') {
              throw new Error('Recovery dispatch must run from main.');
            }

            const findTag = async (tag) => {
              try {
                const reference = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                const response = await github.rest.repos.getCommit({ owner, repo, ref: reference.data.ref });
                return response.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
                return null;
              }
            };
            const hasRelease = async (tag) => {
              try {
                await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                return true;
              } catch (error) {
                if (error.status !== 404) throw error;
                return false;
              }
            };
            const readProject = async (ref) => {
              const response = await github.rest.repos.getContent({
                owner, repo, ref, path: 'VoidDisplay.xcodeproj/project.pbxproj',
              });
              if (response.data.type !== 'file' || response.data.encoding !== 'base64') {
                throw new Error(`Unable to read project metadata at ${ref}.`);
              }
              const source = Buffer.from(response.data.content, 'base64').toString('utf8');
              const value = (key) => {
                const pattern = new RegExp(`^[ \\t]*${key}[ \\t]*=[ \\t]*([^;]+);`, 'gm');
                const values = [...new Set([...source.matchAll(pattern)].map(match => match[1].trim()))];
                if (values.length !== 1) throw new Error(`Expected one unique ${key} at ${ref}.`);
                return values[0];
              };
              const version = value('MARKETING_VERSION');
              const buildNumber = value('CURRENT_PROJECT_VERSION');
              if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
                throw new Error(`Invalid MARKETING_VERSION: ${version}.`);
              }
              if (!/^[1-9][0-9]*$/.test(buildNumber)) {
                throw new Error(`Invalid CURRENT_PROJECT_VERSION: ${buildNumber}.`);
              }
              return { version, buildNumber };
            };

            const mainResponse = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = mainResponse.data.commit.sha;
            let targetSha = pushSha;
            let resolution = 'push_sha';
            let tagSha;
            if (eventName === 'workflow_dispatch') {
              if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(inputTag)) {
                throw new Error(`Recovery tag is invalid: ${inputTag}`);
              }
              tagSha = await findTag(inputTag);
              targetSha = tagSha || mainSha;
              resolution = tagSha ? 'existing_tag' : 'current_main';
            }
            if (!/^[0-9a-f]{40}$/i.test(targetSha)) {
              throw new Error(`Release target SHA is invalid: ${targetSha}`);
            }
            if (targetSha !== mainSha) {
              const comparison = await github.rest.repos.compareCommits({ owner, repo, base: targetSha, head: mainSha });
              if (comparison.data.merge_base_commit?.sha !== targetSha) {
                throw new Error(`Release target ${targetSha} is not an ancestor of main ${mainSha}.`);
              }
            }

            let releaseExists = eventName === 'workflow_dispatch' && tagSha ? await hasRelease(inputTag) : false;
            const { version, buildNumber } = releaseExists
              ? { version: '', buildNumber: '' }
              : await readProject(targetSha);
            const tag = releaseExists ? inputTag : `v${version}`;
            if (eventName === 'workflow_dispatch' && inputTag !== tag) {
              throw new Error(`Input tag ${inputTag} does not match MARKETING_VERSION ${version}.`);
            }
            if (eventName === 'push') tagSha = await findTag(tag);
            if (eventName === 'push' && tagSha) releaseExists = await hasRelease(tag);
            let shouldRun = !releaseExists;
            let reason = releaseExists ? 'release_exists' : 'manual_recovery';
            if (eventName === 'push') {
              const beforeSha = process.env.BEFORE_SHA;
              if (!/^[0-9a-f]{40}$/i.test(beforeSha || '') || /^0+$/.test(beforeSha)) {
                throw new Error('Unable to compare against the previous main commit.');
              }
              const previous = await readProject(beforeSha);
              if (previous.version === version && tagSha) {
                shouldRun = false;
                reason = 'version_unchanged_existing_tag';
              } else {
                if (previous.version !== version && Number(buildNumber) <= Number(previous.buildNumber)) {
                  throw new Error('CURRENT_PROJECT_VERSION must increase when MARKETING_VERSION changes.');
                }
                if (tagSha && tagSha !== targetSha) {
                  throw new Error(`Tag ${tag} already points to ${tagSha}, expected ${targetSha}.`);
                }
                reason = releaseExists ? 'release_exists' : 'main_version_gate';
              }
            }

            core.setOutput('should_run', String(shouldRun));
            core.setOutput('target_sha', targetSha);
            core.setOutput('tag', tag);
            core.setOutput('version', version);
            core.setOutput('build_number', buildNumber);
            await fs.mkdir(path.dirname(summaryPath), { recursive: true });
            await fs.writeFile(summaryPath, `${JSON.stringify({
              status: 'passed',
              repository: `${owner}/${repo}`,
              event_name: eventName,
              input_tag: inputTag,
              workflow_ref: workflowRef,
              main_sha: mainSha,
              target_sha: targetSha,
              resolution,
              release_exists: releaseExists,
              should_run: shouldRun,
              reason,
              tag,
              version,
              build_number: buildNumber,
            }, null, 2)}\n`);

      - name: Upload target summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-target-summary
          path: .ai-tmp/release-target
          if-no-files-found: warn
          retention-days: 14

  build_dmg:
    name: build-dmg (${{ matrix.label }})
    needs:
      - resolve_release_target
      - require_ci_gate
    if: ${{ needs.resolve_release_target.outputs.should_run == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            arch: arm64
            runs_on: macos-26
          - label: intel64
            arch: x86_64
            runs_on: macos-26-intel
    steps:
      - name: Checkout trusted release tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve_release_target.outputs.target_sha }}
          path: release-target
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Bootstrap release tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          target_root="$GITHUB_WORKSPACE/release-target"
          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Build ad hoc DMG and SBOM
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          target_root="$GITHUB_WORKSPACE/release-target"
          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/build.sh" \
            --tag '${{ needs.resolve_release_target.outputs.tag }}' \
            --arch '${{ matrix.arch }}' \
            --label '${{ matrix.label }}' \
            --out-dir "$GITHUB_WORKSPACE/.ai-tmp/release-${{ matrix.label }}"

      - name: Verify local release asset
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          target_root="$GITHUB_WORKSPACE/release-target"
          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/verify.sh" \
            --assets-dir "$GITHUB_WORKSPACE/.ai-tmp/release-${{ matrix.label }}/release-assets" \
            --tag '${{ needs.resolve_release_target.outputs.tag }}' \
            --label '${{ matrix.label }}' \
            --arch '${{ matrix.arch }}'

      - name: Attest DMG provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: .ai-tmp/release-${{ matrix.label }}/release-assets/*.dmg

      - name: Attest checksum provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: .ai-tmp/release-${{ matrix.label }}/release-assets/*.sha256

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: .ai-tmp/release-${{ matrix.label }}/release-assets/*.spdx.json

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: .ai-tmp/release-${{ matrix.label }}/release-assets/VoidDisplay-${{ needs.resolve_release_target.outputs.tag }}-${{ matrix.label }}.dmg
          sbom-path: .ai-tmp/release-${{ matrix.label }}/release-assets/VoidDisplay-${{ needs.resolve_release_target.outputs.tag }}-${{ matrix.label }}.dmg.spdx.json

      - name: Upload release summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-summaries-${{ matrix.label }}
          path: .ai-tmp/release-${{ matrix.label }}/**/*summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ matrix.label }}
          path: |
            .ai-tmp/release-${{ matrix.label }}/release-assets/*.dmg
            .ai-tmp/release-${{ matrix.label }}/release-assets/*.sha256
            .ai-tmp/release-${{ matrix.label }}/release-assets/*.spdx.json
            .ai-tmp/release-${{ matrix.label }}/release-assets/*.json
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: publish-github-release
    needs:
      - resolve_release_target
      - require_ci_gate
      - build_dmg
    if: ${{ needs.resolve_release_target.outputs.should_run == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout trusted release tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout release target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve_release_target.outputs.target_sha }}
          path: release-target
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap publish tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          target_root="$GITHUB_WORKSPACE/release-target"
          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Verify downloaded release assets and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lah release-assets
          tool_root="$GITHUB_WORKSPACE"
          target_root="$GITHUB_WORKSPACE/release-target"

          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/verify.sh" \
            --assets-dir "$GITHUB_WORKSPACE/release-assets" \
            --tag '${{ needs.resolve_release_target.outputs.tag }}' \
            --label arm64 \
            --arch arm64 \
            --repository '${{ github.repository }}' \
            --require-attestation true

          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/verify.sh" \
            --assets-dir "$GITHUB_WORKSPACE/release-assets" \
            --tag '${{ needs.resolve_release_target.outputs.tag }}' \
            --label intel64 \
            --arch x86_64 \
            --repository '${{ github.repository }}' \
            --require-attestation true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          target_root="$GITHUB_WORKSPACE/release-target"
          ROOT_DIR="$target_root" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/publish.sh" \
            --assets-dir "$GITHUB_WORKSPACE/release-assets" \
            --tag '${{ needs.resolve_release_target.outputs.tag }}' \
            --target-sha '${{ needs.resolve_release_target.outputs.target_sha }}' \
            --repository '${{ github.repository }}' \
            --out-dir "$GITHUB_WORKSPACE/.ai-tmp/release-publish"

      - name: Upload publish summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publish-summary
          path: .ai-tmp/release-publish
          if-no-files-found: error
          retention-days: 14

      - name: Upload publish verification summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publish-verify-summaries
          path: release-assets/*.verify-summary.json
          if-no-files-found: error
          retention-days: 14

  require_ci_gate:
    name: require-ci-gate
    needs:
      - resolve_release_target
    if: ${{ needs.resolve_release_target.outputs.should_run == 'true' && needs.resolve_release_target.outputs.target_sha != '' }}
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require target ci-gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ needs.resolve_release_target.outputs.target_sha }}
          CHECK_NAME: ci-gate
          TIMEOUT_SECONDS: '4200'
          POLL_INTERVAL_SECONDS: '20'
          SUMMARY_PATH: .ai-tmp/release-ci-gate/require-ci-gate-summary.json
        with:
          script: |
            const fs = require('fs/promises');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const targetSha = process.env.TARGET_SHA;
            const checkName = process.env.CHECK_NAME;
            const timeoutSeconds = Number(process.env.TIMEOUT_SECONDS);
            const pollIntervalSeconds = Number(process.env.POLL_INTERVAL_SECONDS);
            const summaryPath = process.env.SUMMARY_PATH;

            if (!targetSha) {
              throw new Error('TARGET_SHA is required.');
            }
            if (!checkName) {
              throw new Error('CHECK_NAME is required.');
            }
            if (!Number.isInteger(timeoutSeconds) || timeoutSeconds <= 0) {
              throw new Error('TIMEOUT_SECONDS must be a positive integer.');
            }
            if (!Number.isInteger(pollIntervalSeconds) || pollIntervalSeconds <= 0) {
              throw new Error('POLL_INTERVAL_SECONDS must be a positive integer.');
            }

            let snapshot = {
              gate_state: 'missing',
              source: 'none',
              detail: '',
            };

            const writeSummary = async (status, reason, elapsedSeconds) => {
              await fs.mkdir(path.dirname(summaryPath), { recursive: true });
              const summary = {
                status,
                reason,
                repository,
                target_sha: targetSha,
                check_name: checkName,
                ...snapshot,
                elapsed_seconds: elapsedSeconds,
              };
              await fs.writeFile(summaryPath, `${JSON.stringify(summary, null, 2)}\n`);
            };

            const loadGateSnapshot = async () => {
              snapshot = {
                gate_state: 'missing',
                source: 'workflow_jobs',
                detail: 'No main push CI run found for the target SHA.',
              };

              try {
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  branch: 'main',
                  event: 'push',
                  head_sha: targetSha,
                  per_page: 100,
                });
                const workflowRun = workflowRuns
                  .sort((left, right) => left.id - right.id)
                  .at(-1);
                if (!workflowRun) return;

                snapshot.workflow_run_id = workflowRun.id;
                snapshot.workflow_run_attempt = workflowRun.run_attempt;
                snapshot.detail = `run_status=${workflowRun.status} conclusion=${workflowRun.conclusion || 'none'}`;
                // A rerun can still expose a previous attempt's successful job while it is pending.
                if (workflowRun.status !== 'completed') {
                  snapshot.gate_state = 'pending';
                  return;
                }

                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: workflowRun.id,
                  filter: 'latest',
                  per_page: 100,
                });
                const job = jobs.find((candidate) => candidate.name === checkName);
                if (!job) {
                  snapshot.gate_state = 'failure';
                  snapshot.detail = `Completed main push CI run has no ${checkName} job.`;
                  return;
                }

                snapshot.job_id = job.id;
                snapshot.detail = `job_status=${job.status} conclusion=${job.conclusion || 'none'}`;
                if (job.status !== 'completed') {
                  snapshot.gate_state = 'pending';
                  return;
                }
                if (job.conclusion !== 'success') {
                  snapshot.gate_state = 'failure';
                  return;
                }

                // Recheck main after the CI wait so a rollback revokes pending release eligibility.
                const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
                snapshot.main_sha = main.data.commit.sha;
                if (snapshot.main_sha !== targetSha) {
                  const comparison = await github.rest.repos.compareCommits({
                    owner, repo, base: targetSha, head: snapshot.main_sha,
                  });
                  if (comparison.data.merge_base_commit?.sha !== targetSha) {
                    snapshot.gate_state = 'target_not_on_main';
                    snapshot.detail = `Target is no longer an ancestor of main (${snapshot.main_sha}).`;
                    return;
                  }
                }
                snapshot.gate_state = 'success';
              } catch (error) {
                snapshot.gate_state = 'api_error';
                snapshot.detail = error.message;
              }
            };

            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const startTime = Date.now();

            for (;;) {
              await loadGateSnapshot();
              const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

              if (snapshot.gate_state === 'success') {
                await writeSummary('passed', 'ci_gate_success', elapsedSeconds);
                core.info(`Required main push CI passed: ${checkName} on ${targetSha}, run ${snapshot.workflow_run_id}, attempt ${snapshot.workflow_run_attempt}`);
                return;
              }

              if (['failure', 'api_error', 'target_not_on_main'].includes(snapshot.gate_state)) {
                await writeSummary('failed', `ci_gate_${snapshot.gate_state}`, elapsedSeconds);
                throw new Error(`Required target check ${checkName} is ${snapshot.gate_state} for ${targetSha}. ${snapshot.detail}`);
              }

              if (elapsedSeconds >= timeoutSeconds) {
                await writeSummary('failed', 'ci_gate_timeout', elapsedSeconds);
                throw new Error(`Timed out waiting for ${checkName} on ${targetSha}. Last state: ${snapshot.gate_state}. ${snapshot.detail}`);
              }

              core.info(`Waiting for ${checkName} on ${targetSha}: ${snapshot.gate_state}. ${snapshot.detail}`);
              await sleep(pollIntervalSeconds * 1000);
            }

      - name: Upload release ci-gate summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-ci-gate
          path: .ai-tmp/release-ci-gate
          if-no-files-found: error
          retention-days: 14
