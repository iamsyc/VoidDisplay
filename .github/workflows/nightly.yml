name: Nightly

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core_regression:
    name: core-regression
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bootstrap tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Run core regression gate
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/full_regression.sh" \
            --skip-ui-tests \
            --skip-release-smoke \
            --skip-xcode-preflight \
            --out-dir .ai-tmp/nightly-core-regression

      - name: Upload core regression artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-core-regression
          path: .ai-tmp/nightly-core-regression
          if-no-files-found: warn
          retention-days: 7

  full_ui_tests:
    name: full-ui-tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh" --profile xcode

      - name: Cache Xcode module metadata
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .ai-tmp/nightly-full-ui/DerivedData/ModuleCache.noindex
          key: xcode-meta-nightly-ui-${{ runner.os }}-${{ hashFiles('VoidDisplay.xcodeproj/**', '**/Package.resolved') }}

      - name: Build full UI test bundle
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/xcode.sh" \
            --action build-for-testing \
            --configuration Debug \
            --derived-data-path .ai-tmp/nightly-full-ui/DerivedData \
            --out-dir .ai-tmp/nightly-full-ui/build

      - name: Run full UI suite serially
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/xcode.sh" \
            --action test-without-building \
            --configuration Debug \
            --derived-data-path .ai-tmp/nightly-full-ui/DerivedData \
            --only-testing VoidDisplayUITests \
            --out-dir .ai-tmp/nightly-full-ui/test

      - name: Upload full UI artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-full-ui
          path: .ai-tmp/nightly-full-ui
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bootstrap tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Run coverage unit gate
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/coverage.sh" --out-dir .ai-tmp/nightly-coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-coverage
          path: |
            .ai-tmp/nightly-coverage
            .build/debug/codecov
          if-no-files-found: warn
          retention-days: 7

  nightly_summary:
    name: nightly-summary
    if: always()
    needs:
      - core_regression
      - coverage
      - full_ui_tests
      - release_dry_run
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Write nightly summary
        env:
          CORE_RESULT: ${{ needs.core_regression.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          UI_RESULT: ${{ needs.full_ui_tests.result }}
          RELEASE_RESULT: ${{ needs.release_dry_run.result }}
        run: |
          {
            echo "## Nightly Summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Core regression | ${CORE_RESULT} |"
            echo "| Coverage | ${COVERAGE_RESULT} |"
            echo "| Full serial UI suite | ${UI_RESULT} |"
            echo "| Release dry run | ${RELEASE_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release_dry_run:
    name: release-dry-run (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            arch: arm64
            runs_on: macos-26
          - label: intel64
            arch: x86_64
            runs_on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bootstrap tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Build and verify release dry run
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' VoidDisplay.xcodeproj/project.pbxproj | sort -u)"
          test -n "$version"
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/build.sh" \
            --tag "v${version}" \
            --arch '${{ matrix.arch }}' \
            --label '${{ matrix.label }}' \
            --out-dir '.ai-tmp/nightly-release-${{ matrix.label }}'
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/release/verify.sh" \
            --assets-dir '.ai-tmp/nightly-release-${{ matrix.label }}/release-assets' \
            --tag "v${version}" \
            --label '${{ matrix.label }}' \
            --arch '${{ matrix.arch }}'

      - name: Upload release dry run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-release-${{ matrix.label }}
          path: .ai-tmp/nightly-release-${{ matrix.label }}/release-assets
          if-no-files-found: warn
          retention-days: 7
