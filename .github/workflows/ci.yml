name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'VoidDisplay/**'
      - 'VoidDisplayTests/**'
      - 'VoidDisplayUITests/**'
      - 'VoidDisplay.xcodeproj/**'
      - 'scripts/test/**'
      - 'docs/testing/coverage-baseline.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_reusable-unit-tests.yml'
      - '.github/workflows/_reusable-ui-smoke-tests.yml'
      - '.github/actions/xcode-select/**'
  pull_request:
    paths:
      - 'VoidDisplay/**'
      - 'VoidDisplayTests/**'
      - 'VoidDisplayUITests/**'
      - 'VoidDisplay.xcodeproj/**'
      - 'scripts/test/**'
      - 'docs/testing/coverage-baseline.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_reusable-unit-tests.yml'
      - '.github/workflows/_reusable-ui-smoke-tests.yml'
      - '.github/actions/xcode-select/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: unit-tests
    uses: ./.github/workflows/_reusable-unit-tests.yml
    with:
      artifact_retention_days: 7

  ui_smoke_tests:
    name: ui-smoke-tests
    continue-on-error: true
    uses: ./.github/workflows/_reusable-ui-smoke-tests.yml
    with:
      artifact_retention_days: 7

  ci_gate:
    name: ci-gate
    if: always()
    needs:
      - unit_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce unit-test gate
        env:
          UNIT_RESULT: ${{ needs.unit_tests.result }}
        run: |
          set -euo pipefail
          echo "Unit tests job result: ${UNIT_RESULT}"
          if [ "${UNIT_RESULT}" = "success" ]; then
            exit 0
          fi
          echo "Gate failed because unit-tests result is ${UNIT_RESULT}."
          exit 1

  ci_summary:
    name: ci-summary
    if: always()
    needs:
      - unit_tests
      - ui_smoke_tests
      - ci_gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Render summary and update PR sticky comment
        uses: actions/github-script@v7
        env:
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          UI_JOB_RESULT: ${{ needs.ui_smoke_tests.result }}
          UI_STATUS: ${{ needs.ui_smoke_tests.outputs.ui_status || 'unknown' }}
          UI_REASON: ${{ needs.ui_smoke_tests.outputs.ui_reason || 'not_run' }}
          UI_ATTEMPT: ${{ needs.ui_smoke_tests.outputs.ui_attempt || '-' }}
          UI_MAX_ATTEMPTS: ${{ needs.ui_smoke_tests.outputs.ui_max_attempts || '-' }}
          UI_LOG_FILE: ${{ needs.ui_smoke_tests.outputs.ui_log_file || '-' }}
          UI_ENFORCED_EXIT_CODE: ${{ needs.ui_smoke_tests.outputs.ui_enforced_exit_code || '-' }}
          GATE_RESULT: ${{ needs.ci_gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- ci-summary-marker -->';
            const unitResult = process.env.UNIT_RESULT || 'unknown';
            const uiJobResult = process.env.UI_JOB_RESULT || 'unknown';
            const uiStatus = process.env.UI_STATUS || 'unknown';
            const uiReason = process.env.UI_REASON || 'not_run';
            const uiAttempt = process.env.UI_ATTEMPT || '-';
            const uiMaxAttempts = process.env.UI_MAX_ATTEMPTS || '-';
            const uiLogFile = process.env.UI_LOG_FILE || '-';
            const uiEnforcedExitCode = process.env.UI_ENFORCED_EXIT_CODE || '-';
            const gateResult = process.env.GATE_RESULT || 'unknown';
            const runUrl = process.env.RUN_URL;

            const uiDetails = `reason=${uiReason}; attempts=${uiAttempt}/${uiMaxAttempts}; log=${uiLogFile}; enforced_exit=${uiEnforcedExitCode}; job_result=${uiJobResult}`;
            const summaryLines = [
              '## CI Summary',
              '',
              `Run: [Open](${runUrl})`,
              '',
              '| Check | Status | Details |',
              '| --- | --- | --- |',
              `| Unit Tests | ${unitResult} | required |`,
              `| UI Smoke Tests | ${uiStatus} | ${uiDetails} |`,
              `| CI Gate | ${gateResult} | required; driven by Unit Tests only |`,
              '',
              'Gate rule: only `Unit Tests` is required to pass; `UI Smoke Tests` is informational (non-blocking).',
            ];
            const summaryBody = summaryLines.join('\n');
            const commentBody = [marker, ...summaryLines].join('\n');

            await core.summary.addRaw(summaryBody + '\n').write();

            if (context.eventName !== 'pull_request') {
              return;
            }

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.warning('No pull_request.number found in event payload; skip sticky comment update.');
              return;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const existing = [...comments].reverse().find((comment) =>
                comment.user?.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (existing && existing.body === commentBody) {
                core.info('CI summary unchanged; skip PR comment update.');
                return;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
                core.info('Updated CI summary PR comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
                core.info('Created CI summary PR comment.');
              }
            } catch (error) {
              core.warning(`Failed to update CI summary sticky comment: ${error.message}`);
            }
