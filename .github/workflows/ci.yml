name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'Apps/VoidDisplay/VoidDisplay.xcodeproj/**'
      - 'Package.swift'
      - 'scripts/**'
      - 'docs/testing/coverage-baseline.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: classify-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_relevant: ${{ steps.classify.outputs.code_relevant }}
      change_scope: ${{ steps.classify.outputs.change_scope }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            const codePrefixes = [
              'Sources/',
              'Tests/',
              'UITests/',
              'Apps/VoidDisplay/VoidDisplay.xcodeproj/',
              'scripts/',
              '.github/workflows/',
              '.github/actions/',
            ];
            const exactMatches = new Set([
              'Package.swift',
              'docs/testing/coverage-baseline.json',
            ]);

            let codeRelevant = true;

            if (context.eventName === 'pull_request') {
              const pullNumber = context.payload.pull_request?.number;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              });

              const changedFiles = files.map((file) => file.filename);
              core.info(`Changed files (${changedFiles.length}): ${changedFiles.join(', ')}`);

              codeRelevant = changedFiles.some((file) =>
                exactMatches.has(file) || codePrefixes.some((prefix) => file.startsWith(prefix))
              );
            }

            core.setOutput('code_relevant', codeRelevant ? 'true' : 'false');
            core.setOutput('change_scope', codeRelevant ? 'code' : 'non_code');

  unit_tests:
    name: unit-tests
    needs:
      - classify_changes
    if: ${{ github.event_name != 'pull_request' || needs.classify_changes.outputs.code_relevant == 'true' }}
    uses: ./.github/workflows/_reusable-unit-tests.yml
    with:
      artifact_retention_days: 7

  ui_smoke_tests:
    name: ui-smoke-tests (${{ matrix.case_name }})
    needs:
      - classify_changes
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && needs.classify_changes.outputs.code_relevant == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_name: baseline
            only_testing: VoidDisplayUITests/HomeSmokeTests/testHomeNavigationSmoke_baseline
          - case_name: permissionDenied
            only_testing: VoidDisplayUITests/HomeSmokeTests/testPermissionDeniedSmoke_captureAndShare
          - case_name: rebuildFailed
            only_testing: VoidDisplayUITests/HomeSmokeTests/testVirtualDisplaySmoke_rebuildFailedRowShowsRetry
    uses: ./.github/workflows/_reusable-ui-smoke-tests.yml
    with:
      only_testing: ${{ matrix.only_testing }}
      artifact_retention_days: 7
      artifact_name_suffix: ${{ matrix.case_name }}
      enforce_failure: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

  release_build_check:
    name: release-build-check (${{ matrix.label }})
    needs:
      - classify_changes
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && needs.classify_changes.outputs.code_relevant == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            arch: arm64
            runs_on: macos-26
          - label: intel64
            arch: x86_64
            runs_on: macos-26-intel
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Tools/VoidDisplayRelay/go.mod
          cache-dependency-path: Tools/VoidDisplayRelay/go.sum

      - name: Build Release app (unsigned)
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme VoidDisplay \
            -project Apps/VoidDisplay/VoidDisplay.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath ".ai-tmp/release-check-${LABEL}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS="${ARCH}" \
            build

      - name: Thin/sign/verify for target arch
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          app_path=".ai-tmp/release-check-${LABEL}/DerivedData/Build/Products/Release/VoidDisplay.app"
          if [ ! -d "${app_path}" ]; then
            echo "Expected app not found: ${app_path}"
            exit 1
          fi

          bash scripts/release/thin_webrtc_and_sign.sh "${app_path}" "${ARCH}"

  ci_gate:
    name: ci-gate
    if: always()
    needs:
      - classify_changes
      - unit_tests
      - ui_smoke_tests
      - release_build_check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce CI gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CHANGE_SCOPE: ${{ needs.classify_changes.outputs.change_scope }}
          CODE_RELEVANT: ${{ needs.classify_changes.outputs.code_relevant }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          UI_RESULT: ${{ needs.ui_smoke_tests.result }}
          RELEASE_RESULT: ${{ needs.release_build_check.result }}
        run: |
          set -euo pipefail
          is_non_code_pr=false
          is_main_pr=false

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${CODE_RELEVANT}" = "false" ]; then
            is_non_code_pr=true
          elif [ "${EVENT_NAME}" = "pull_request" ] && [ "${BASE_REF}" = "main" ] && [ "${CODE_RELEVANT}" = "true" ]; then
            is_main_pr=true
          fi

          echo "Change scope: ${CHANGE_SCOPE}"
          echo "Code relevant: ${CODE_RELEVANT}"
          echo "Unit tests job result: ${UNIT_RESULT}"
          echo "UI smoke matrix job result: ${UI_RESULT}"
          echo "Release build check job result: ${RELEASE_RESULT}"
          echo "Non-code PR fast-path: ${is_non_code_pr}"
          echo "Main PR gate mode: ${is_main_pr}"

          if [ "${is_non_code_pr}" = "true" ]; then
            echo "Gate passed because this PR only contains non-code changes."
            exit 0
          fi

          if [ "${UNIT_RESULT}" != "success" ]; then
            echo "Gate failed because unit-tests result is ${UNIT_RESULT}."
            exit 1
          fi

          if [ "${is_main_pr}" = "true" ] && [ "${UI_RESULT}" != "success" ]; then
            echo "Gate failed because this is a main PR and ui-smoke-tests result is ${UI_RESULT}."
            exit 1
          fi

          if [ "${is_main_pr}" = "true" ] && [ "${RELEASE_RESULT}" != "success" ]; then
            echo "Gate failed because this is a main PR and release-build-check result is ${RELEASE_RESULT}."
            exit 1
          fi

          exit 0

  ci_summary:
    name: ci-summary
    if: always()
    needs:
      - classify_changes
      - unit_tests
      - ui_smoke_tests
      - release_build_check
      - ci_gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Render summary and update PR sticky comment
        uses: actions/github-script@v8
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CHANGE_SCOPE: ${{ needs.classify_changes.outputs.change_scope }}
          CODE_RELEVANT: ${{ needs.classify_changes.outputs.code_relevant }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          UI_JOB_RESULT: ${{ needs.ui_smoke_tests.result }}
          RELEASE_RESULT: ${{ needs.release_build_check.result }}
          GATE_RESULT: ${{ needs.ci_gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- ci-summary-marker -->';
            const eventName = process.env.EVENT_NAME || 'unknown';
            const baseRef = process.env.BASE_REF || '';
            const changeScope = process.env.CHANGE_SCOPE || 'unknown';
            const codeRelevant = process.env.CODE_RELEVANT === 'true';
            const unitResult = process.env.UNIT_RESULT || 'unknown';
            const uiJobResult = process.env.UI_JOB_RESULT || 'unknown';
            const releaseResult = process.env.RELEASE_RESULT || 'unknown';
            const gateResult = process.env.GATE_RESULT || 'unknown';
            const runUrl = process.env.RUN_URL;
            const isNonCodePr = eventName === 'pull_request' && !codeRelevant;
            const isMainCodePr = eventName === 'pull_request' && baseRef === 'main' && codeRelevant;
            const unitDetails = isNonCodePr
              ? 'skipped; non-code pull request'
              : 'required';
            const uiDetails = isNonCodePr
              ? 'skipped; non-code pull request'
              : isMainCodePr
              ? 'required; matrix: baseline + permissionDenied + rebuildFailed'
              : 'not run; only main-targeting code PRs include UI smoke';
            const gateDetails = isNonCodePr
              ? 'required; non-code PR fast-path'
              : isMainCodePr
              ? 'required; driven by Unit Tests + UI Smoke Tests + Release Build Check'
              : 'required; driven by Unit Tests only';
            const releaseDetails = isNonCodePr
              ? 'skipped; non-code pull request'
              : isMainCodePr
              ? 'required; Release arch smoke check (arm64 + x86_64 with thin/sign/verify)'
              : 'not run; only main-targeting code PRs include release arch smoke check';
            const gateRule = isNonCodePr
              ? 'Gate rule: 本次 PR 仅包含非代码变更，已跳过 `Unit Tests` / `UI Smoke Tests` / `Release Build Check`，`ci-gate` 直接通过。'
              : isMainCodePr
              ? 'Gate rule: target `main` 的代码相关 PR 必须通过 `Unit Tests` + `UI Smoke Tests` + `Release Build Check`。'
              : 'Gate rule: 非 `main` 的代码 PR 与 `push` 到 `main` 仅要求 `Unit Tests` 通过；`UI Smoke Tests` 与 `Release Build Check` 不属于该链路。';

            const summaryLines = [
              '## CI Summary',
              '',
              `Run: [Open](${runUrl})`,
              '',
              '| Check | Status | Details |',
              '| --- | --- | --- |',
              `| Change Scope | ${changeScope} | ${codeRelevant ? 'code-relevant change set' : 'non-code pull request fast-path'} |`,
              `| Unit Tests | ${unitResult} | ${unitDetails} |`,
              `| UI Smoke Tests (matrix: baseline + permissionDenied + rebuildFailed) | ${uiJobResult} | ${uiDetails} |`,
              `| Release Build Check (Release arch smoke: arm64 + x86_64) | ${releaseResult} | ${releaseDetails} |`,
              `| CI Gate | ${gateResult} | ${gateDetails} |`,
              '',
              gateRule,
            ];
            const summaryBody = summaryLines.join('\n');
            const commentBody = [marker, ...summaryLines].join('\n');

            await core.summary.addRaw(summaryBody + '\n').write();

            if (context.eventName !== 'pull_request') {
              return;
            }

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.warning('No pull_request.number found in event payload; skip sticky comment update.');
              return;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const existing = [...comments].reverse().find((comment) =>
                comment.user?.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker)
              );

              if (existing && existing.body === commentBody) {
                core.info('CI summary unchanged; skip PR comment update.');
                return;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
                core.info('Updated CI summary PR comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
                core.info('Created CI summary PR comment.');
              }
            } catch (error) {
              core.warning(`Failed to update CI summary sticky comment: ${error.message}`);
            }
