name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'Apps/VoidDisplay/**'
      - 'Tools/VoidDisplayRelay/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '**/Package.resolved'
      - 'mise.toml'
      - 'Brewfile'
      - '.swiftformat'
      - '.swiftlint.yml'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: classify-changes
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_relevant: ${{ steps.classify.outputs.code_relevant }}
      ui_relevant: ${{ steps.classify.outputs.ui_relevant }}
      script_relevant: ${{ steps.classify_scripts.outputs.script_relevant }}
      change_scope: ${{ steps.classify.outputs.change_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Checkout trusted classification scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ai-tmp/trusted-ci
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
            for required in \
              scripts/build-relay.sh \
              scripts/lib/contract.sh \
              scripts/lib/common.sh \
              scripts/lib/artifacts.sh \
              scripts/lib/xcode.sh \
              scripts/lib/xcresult.sh \
              scripts/lib/architecture.sh \
              scripts/lib/release_binaries.sh \
              scripts/dev/bootstrap.sh \
              scripts/dev/doctor.sh \
              scripts/ci/classify.sh; do
              if [ ! -e "$tool_root/$required" ]; then
                echo "Missing trusted CI script in base checkout: $required. Merge the seed PR into the base branch first." >&2
                exit 1
              fi
            done
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/classify.sh" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary .ai-tmp/classify/classify-summary.json

      - name: Classify script changes
        id: classify_scripts
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          script_relevant=false
          script_dir=scripts
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            script_relevant=true
          else
            while IFS= read -r file_path; do
              case "$file_path" in
              "$script_dir"/* | .github/workflows/* | .github/actions/* | mise.toml | Brewfile | .swiftformat | .swiftlint.yml | .github/dependabot.yml)
                script_relevant=true
                break
                ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "script_relevant=$script_relevant" >>"$GITHUB_OUTPUT"

      - name: Upload classify artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classify
          path: .ai-tmp/classify
          if-no-files-found: warn
          retention-days: 7

  dependency_review:
    name: dependency-review
    needs:
      - classify_changes
    if: ${{ github.event_name == 'pull_request' && needs.classify_changes.outputs.code_relevant == 'true' }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  script_static_checks:
    name: script-static-checks
    needs:
      - classify_changes
    if: ${{ github.event_name != 'pull_request' || needs.classify_changes.outputs.code_relevant == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout trusted scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ai-tmp/trusted-ci
          persist-credentials: false

      - name: Bootstrap static tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
            for required in \
              scripts/build-relay.sh \
              scripts/lib/contract.sh \
              scripts/lib/common.sh \
              scripts/lib/artifacts.sh \
              scripts/lib/xcode.sh \
              scripts/lib/xcresult.sh \
              scripts/lib/architecture.sh \
              scripts/lib/release_binaries.sh \
              scripts/dev/bootstrap.sh \
              scripts/dev/doctor.sh \
              scripts/ci/classify.sh \
              scripts/ci/static.sh \
              scripts/ci/unit.sh \
              scripts/ci/xcode.sh \
              scripts/ci/ui_smoke.sh \
              scripts/ci/release_smoke.sh \
              scripts/ci/release_arch_check.sh \
              scripts/ci/download_relay_modules.sh \
              scripts/release/thin_webrtc_and_sign.sh \
              scripts/ci/fixtures/xcode-log-scanner/negative-ordinary-text.log \
              scripts/ci/fixtures/xcode-log-scanner/positive-build-failed.log \
              scripts/ci/fixtures/xcode-log-scanner/positive-clang.log \
              scripts/ci/fixtures/xcode-log-scanner/positive-linker.log \
              scripts/ci/fixtures/xcode-log-scanner/positive-swift.log \
              scripts/ci/fixtures/xcode-log-scanner/positive-test-failed.log; do
              if [ ! -e "$tool_root/$required" ]; then
                echo "Missing trusted CI script in base checkout: $required. Merge the seed PR into the base branch first." >&2
                exit 1
              fi
            done
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Validate static gates
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/static.sh"

  head_script_self_test:
    name: head-script-self-test
    needs:
      - classify_changes
    if: ${{ github.event_name == 'pull_request' && needs.classify_changes.outputs.script_relevant == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout head without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Checkout trusted bootstrap scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ai-tmp/trusted-ci
          persist-credentials: false

      - name: Bootstrap trusted head-test tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Validate head scripts
        shell: bash
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          MISE_GITHUB_TOKEN: ''
          AQUA_GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/static.sh"

  unit_tests:
    name: unit-tests
    needs:
      - classify_changes
      - script_static_checks
    if: ${{ github.event_name != 'pull_request' || needs.classify_changes.outputs.code_relevant == 'true' }}
    uses: ./.github/workflows/_reusable-unit-tests.yml
    with:
      artifact_retention_days: 7

  xcode_build:
    name: xcode-build
    needs:
      - classify_changes
      - script_static_checks
    if: ${{ github.event_name != 'pull_request' || needs.classify_changes.outputs.code_relevant == 'true' }}
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout trusted scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ai-tmp/trusted-ci
          persist-credentials: false

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Bootstrap tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
            for required in \
              scripts/build-relay.sh \
              scripts/lib/contract.sh \
              scripts/lib/common.sh \
              scripts/lib/artifacts.sh \
              scripts/lib/xcode.sh \
              scripts/lib/xcresult.sh \
              scripts/lib/architecture.sh \
              scripts/lib/release_binaries.sh \
              scripts/dev/bootstrap.sh \
              scripts/dev/doctor.sh \
              scripts/ci/download_relay_modules.sh \
              scripts/ci/xcode.sh; do
              if [ ! -e "$tool_root/$required" ]; then
                echo "Missing trusted CI script in base checkout: $required. Merge the seed PR into the base branch first." >&2
                exit 1
              fi
            done
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Run doctor checks
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/doctor.sh" \
            --out-dir .ai-tmp/xcode-build/doctor

      - name: Xcode Debug build
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/xcode.sh" \
            --action build \
            --configuration Debug \
            --out-dir .ai-tmp/xcode-build

      - name: Upload Xcode build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xcode-build
          path: .ai-tmp/xcode-build
          if-no-files-found: warn
          retention-days: 7

  ui_smoke_tests:
    name: ui-smoke-tests (${{ matrix.case_name }})
    needs:
      - classify_changes
      - script_static_checks
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.classify_changes.outputs.code_relevant == 'true' && needs.classify_changes.outputs.ui_relevant == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_name: baseline
            only_testing: VoidDisplayUITests/HomeSmokeTests/testHomeNavigationSmoke_baseline
          - case_name: permissionDenied
            only_testing: VoidDisplayUITests/HomeSmokeTests/testPermissionDeniedSmoke_captureAndShare
          - case_name: rebuildFailed
            only_testing: VoidDisplayUITests/HomeSmokeTests/testVirtualDisplaySmoke_rebuildFailedRowShowsRetry
    uses: ./.github/workflows/_reusable-ui-smoke-tests.yml
    with:
      only_testing: ${{ matrix.only_testing }}
      artifact_retention_days: 7
      artifact_name_suffix: ${{ matrix.case_name }}
      enforce_failure: true

  release_build_check:
    name: release-build-check (${{ matrix.label }})
    needs:
      - classify_changes
      - script_static_checks
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main' && needs.classify_changes.outputs.code_relevant == 'true') }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            arch: arm64
            runs_on: macos-26
          - label: intel64
            arch: x86_64
            runs_on: macos-26-intel
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout trusted scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ai-tmp/trusted-ci
          persist-credentials: false

      - name: Bootstrap tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
            for required in \
              scripts/build-relay.sh \
              scripts/lib/contract.sh \
              scripts/lib/common.sh \
              scripts/lib/artifacts.sh \
              scripts/lib/xcode.sh \
              scripts/lib/architecture.sh \
              scripts/lib/release_binaries.sh \
              scripts/dev/bootstrap.sh \
              scripts/ci/download_relay_modules.sh \
              scripts/ci/release_arch_check.sh \
              scripts/release/thin_webrtc_and_sign.sh \
              scripts/ci/release_smoke.sh; do
              if [ ! -e "$tool_root/$required" ]; then
                echo "Missing trusted CI script in base checkout: $required. Merge the seed PR into the base branch first." >&2
                exit 1
              fi
            done
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/dev/bootstrap.sh"

      - name: Release smoke
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tool_root="$GITHUB_WORKSPACE/.ai-tmp/trusted-ci"
          fi

          ROOT_DIR="$GITHUB_WORKSPACE" TOOL_ROOT="$tool_root" "$tool_root/scripts/ci/release_smoke.sh" \
            --arch '${{ matrix.arch }}' \
            --label '${{ matrix.label }}' \
            --out-dir '.ai-tmp/release-check-${{ matrix.label }}'

      - name: Upload release smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-smoke-${{ matrix.label }}
          path: .ai-tmp/release-check-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 7

  ci_gate:
    name: ci-gate
    if: always()
    needs:
      - classify_changes
      - dependency_review
      - script_static_checks
      - head_script_self_test
      - unit_tests
      - xcode_build
      - ui_smoke_tests
      - release_build_check
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce CI gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CHANGE_SCOPE: ${{ needs.classify_changes.outputs.change_scope }}
          CODE_RELEVANT: ${{ needs.classify_changes.outputs.code_relevant }}
          UI_RELEVANT: ${{ needs.classify_changes.outputs.ui_relevant }}
          SCRIPT_RELEVANT: ${{ needs.classify_changes.outputs.script_relevant }}
          DEPENDENCY_RESULT: ${{ needs.dependency_review.result }}
          SCRIPT_RESULT: ${{ needs.script_static_checks.result }}
          HEAD_SCRIPT_RESULT: ${{ needs.head_script_self_test.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          XCODE_RESULT: ${{ needs.xcode_build.result }}
          UI_RESULT: ${{ needs.ui_smoke_tests.result }}
          RELEASE_RESULT: ${{ needs.release_build_check.result }}
        run: |
          set -euo pipefail
          is_non_code_pr=false
          is_code_pr=false
          is_main_code_pr=false
          is_main_push=false

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$CODE_RELEVANT" = "false" ]; then
            is_non_code_pr=true
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$CODE_RELEVANT" = "true" ]; then
            is_code_pr=true
          fi
          if [ "$is_code_pr" = "true" ] && [ "$BASE_REF" = "main" ]; then
            is_main_code_pr=true
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            is_main_push=true
          fi

          echo "Change scope: ${CHANGE_SCOPE}"
          echo "Code relevant: ${CODE_RELEVANT}"
          echo "UI relevant: ${UI_RELEVANT}"
          echo "Script relevant: ${SCRIPT_RELEVANT}"
          echo "Dependency review: ${DEPENDENCY_RESULT}"
          echo "Static: ${SCRIPT_RESULT}"
          echo "Head script self-test: ${HEAD_SCRIPT_RESULT}"
          echo "Unit: ${UNIT_RESULT}"
          echo "Xcode build: ${XCODE_RESULT}"
          echo "UI smoke: ${UI_RESULT}"
          echo "Release smoke: ${RELEASE_RESULT}"

          if [ "$is_non_code_pr" = "true" ]; then
            echo "Gate passed through non-code fast path."
            exit 0
          fi

          if [ "$is_code_pr" = "true" ] && [ "$DEPENDENCY_RESULT" != "success" ]; then
            echo "Gate failed because dependency-review result is ${DEPENDENCY_RESULT}."
            exit 1
          fi
          if [ "$SCRIPT_RESULT" != "success" ]; then
            echo "Gate failed because script-static-checks result is ${SCRIPT_RESULT}."
            exit 1
          fi
          if [ "$is_code_pr" = "true" ] && [ "$SCRIPT_RELEVANT" = "true" ] && [ "$HEAD_SCRIPT_RESULT" != "success" ]; then
            echo "Gate failed because script-relevant PR requires head-script-self-test."
            exit 1
          fi
          if [ "$UNIT_RESULT" != "success" ]; then
            echo "Gate failed because unit-tests result is ${UNIT_RESULT}."
            exit 1
          fi
          if [ "$XCODE_RESULT" != "success" ]; then
            echo "Gate failed because xcode-build result is ${XCODE_RESULT}."
            exit 1
          fi
          if [ "$is_code_pr" = "true" ] && [ "$UI_RELEVANT" = "true" ] && [ "$UI_RESULT" != "success" ]; then
            echo "Gate failed because UI-relevant PR requires ui-smoke-tests."
            exit 1
          fi
          if [ "$is_main_push" = "true" ] && [ "$UI_RESULT" != "success" ]; then
            echo "Gate failed because main push requires ui-smoke-tests."
            exit 1
          fi
          if [ "$is_main_code_pr" = "true" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "Gate failed because target-main code PR requires release-build-check."
            exit 1
          fi
          if [ "$is_main_push" = "true" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "Gate failed because main push requires release-build-check."
            exit 1
          fi

          exit 0

  ci_summary:
    name: ci-summary
    if: always()
    needs:
      - classify_changes
      - dependency_review
      - script_static_checks
      - head_script_self_test
      - unit_tests
      - xcode_build
      - ui_smoke_tests
      - release_build_check
      - ci_gate
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Render summary and update PR sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CHANGE_SCOPE: ${{ needs.classify_changes.outputs.change_scope }}
          CODE_RELEVANT: ${{ needs.classify_changes.outputs.code_relevant }}
          UI_RELEVANT: ${{ needs.classify_changes.outputs.ui_relevant }}
          SCRIPT_RELEVANT: ${{ needs.classify_changes.outputs.script_relevant }}
          DEPENDENCY_RESULT: ${{ needs.dependency_review.result }}
          SCRIPT_RESULT: ${{ needs.script_static_checks.result }}
          HEAD_SCRIPT_RESULT: ${{ needs.head_script_self_test.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          UNIT_ARTIFACT: ${{ needs.unit_tests.outputs.artifact_name }}
          UNIT_SWIFT_TEST_COUNT: ${{ needs.unit_tests.outputs.swift_test_count }}
          UNIT_GO_PACKAGE_COUNT: ${{ needs.unit_tests.outputs.go_package_count }}
          UNIT_REASON: ${{ needs.unit_tests.outputs.unit_reason }}
          XCODE_RESULT: ${{ needs.xcode_build.result }}
          UI_RESULT: ${{ needs.ui_smoke_tests.result }}
          RELEASE_RESULT: ${{ needs.release_build_check.result }}
          GATE_RESULT: ${{ needs.ci_gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- ci-summary-marker -->';
            const runUrl = process.env.RUN_URL;
            const artifactsUrl = `${runUrl}#artifacts`;
            const value = (name, fallback = 'n/a') => {
              const raw = process.env[name];
              return raw && raw.trim().length > 0 ? raw : fallback;
            };
            const unitDetails = [
              `Swift tests: ${value('UNIT_SWIFT_TEST_COUNT')}`,
              `Go packages: ${value('UNIT_GO_PACKAGE_COUNT')}`,
              `Reason: ${value('UNIT_REASON')}`,
              `Artifact: ${value('UNIT_ARTIFACT')}`,
            ].join('<br>');
            const uiDetails = [
              'Failure classification is written by ui-smoke-summary.json in each artifact.',
              'Artifacts: ui-smoke-baseline, ui-smoke-permissionDenied, ui-smoke-rebuildFailed',
            ].join('<br>');
            const releaseDetails = [
              'Artifacts: release-smoke-arm64, release-smoke-intel64',
              'Release verify summaries are produced by release.yml before publishing.',
            ].join('<br>');
            const rows = [
              ['Change Scope', process.env.CHANGE_SCOPE || 'unknown', `code=${process.env.CODE_RELEVANT}, ui=${process.env.UI_RELEVANT}`],
              ['Dependency Review', process.env.DEPENDENCY_RESULT || 'unknown', 'code PR gate; high and critical vulnerabilities block'],
              ['Static Checks', process.env.SCRIPT_RESULT || 'unknown', 'actionlint, shellcheck, shfmt, SwiftFormat, SwiftLint, action pinning'],
              ['Head Script Self-Test', process.env.HEAD_SCRIPT_RESULT || 'unknown', `runs for script/tooling PRs; script=${process.env.SCRIPT_RELEVANT}`],
              ['Unit Tests', process.env.UNIT_RESULT || 'unknown', unitDetails],
              ['Xcode Build', process.env.XCODE_RESULT || 'unknown', 'Debug build with zero warning scan<br>Artifact: xcode-build'],
              ['UI Smoke', process.env.UI_RESULT || 'unknown', uiDetails],
              ['Release Smoke', process.env.RELEASE_RESULT || 'unknown', releaseDetails],
              ['Artifacts', 'link', `[Open artifacts](${artifactsUrl})`],
              ['CI Gate', process.env.GATE_RESULT || 'unknown', 'single branch protection check'],
            ];
            const summaryLines = [
              '## CI Summary',
              '',
              `Run: [Open](${process.env.RUN_URL})`,
              '',
              '| Check | Status | Details |',
              '| --- | --- | --- |',
              ...rows.map(([check, status, details]) => `| ${check} | ${status} | ${details} |`),
            ];
            const summaryBody = summaryLines.join('\n');
            const commentBody = [marker, ...summaryLines].join('\n');
            await core.summary.addRaw(summaryBody + '\n').write();

            if (context.eventName !== 'pull_request') {
              return;
            }

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              return;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const existing = [...comments].reverse().find((comment) =>
                comment.user?.type === 'Bot' && typeof comment.body === 'string' && comment.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
              }
            } catch (error) {
              core.warning(`Failed to update CI summary sticky comment: ${error.message}`);
            }
